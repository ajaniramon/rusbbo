name = "social-actions"
description = "Social actions in a public room without NPCs: whispers (to a user, to someone who ignores you, to nobody), chat seen by everyone but the ignoring user, LOOKTO, typing, GOAWAY"

# Room 7 (ballroom, no NPCs). Instance ids follow the entry order: a 0, d 1, c 2.
# a = tracebot1, d = tracebot4, c = tracebot3 (its ignore list holds tracebot1 and tracebot2).
# Chat makes everyone within 14 tiles look at the speaker (Position.getDistanceSquared returns the
# distance, not its square), and both that and LOOKTO start a look timer (6 s, whole seconds,
# checked by the 1 s status task): one more status update comes 6-7 s later. The second LOOKTO
# waits 8 s, which takes in d's update from the chat and a's own.
# Java pings every connection 60 s after it opens and drops it 60 s later without a PONG (which
# would also run the achievement check), so each bot's part of the scenario stays well under 60 s.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "d"
ticket = "trace-sso-4"

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "WALK"
args = [12, 8]
settle_ms = 2500

[[steps]]
bot = "d"
macro = "login"

[[steps]]
bot = "d"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "d"
send = "G_HMAP"

[[steps]]
bot = "d"
send = "G_USRS"

[[steps]]
bot = "d"
send = "G_OBJS"

[[steps]]
bot = "d"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "d"
send = "WALK"
args = [16, 8]
settle_ms = 2500

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "GET_IGNORE_LIST"
note = "The client asks for it after login; only then does Java fill the ignore list that chat and whispers use"

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_USRS"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "c"
send = "WALK"
args = [12, 11]
settle_ms = 2500

# --- Whispers and chat ---


[[steps]]
bot = "a"
send = "WHISPER"
args = ["tracebot4 psst, over here"]
note = "Seen by the sender and the target only"

[[steps]]
bot = "a"
send = "WHISPER"
args = ["tracebot3 hello"]
note = "c ignores tracebot1: only the sender sees it"

[[steps]]
bot = "a"
send = "WHISPER"
args = ["nobody123 anyone?"]
note = "Unknown target: only the sender sees it"

[[steps]]
bot = "d"
send = "WHISPER"
args = ["tracebot1 :) hi"]
note = "Gesture from a smiley, like normal chat"

[[steps]]
bot = "a"
send = "CHAT"
args = ["hello everyone"]
settle_ms = 800
note = "c ignores a: it gets the typing status and d turning its head, not the chat"

# --- Looking ---


[[steps]]
bot = "a"
send = "LOOKTO"
args = [{ raw = "16 8" }]
settle_ms = 800
note = "Shockwave sends 'x y' as the raw body; the new rotation goes out on the next room tick"

[[steps]]
bot = "a"
send = "LOOKTO"
args = [{ raw = "12 11" }]
settle_ms = 8000
note = "Look south at c, then the look timer runs out"

[[steps]]
bot = "a"
send = "LOOKTO"
args = [{ raw = "12 8" }]
settle_ms = 800
note = "Own tile: ignored"

# --- Typing ---


[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600
note = "a leaves right after its last action"

[[steps]]
bot = "a"
disconnect = true
note = "and disconnects, so its connection ends well before the PING Java sends 60 s after connecting"

[[steps]]
bot = "d"
send = "USER_START_TYPING"

[[steps]]
bot = "d"
send = "USER_START_TYPING"
note = "Already typing: nothing"

[[steps]]
bot = "d"
send = "USER_CANCEL_TYPING"

[[steps]]
bot = "d"
send = "USER_CANCEL_TYPING"
note = "Not typing: nothing"

# --- Leaving ---


[[steps]]
bot = "c"
send = "GOAWAY"
settle_ms = 4000
note = "c walks to the door and leaves the room"

[[steps]]
bot = "d"
send = "QUIT"
settle_ms = 600
