name = "staff-ops"
description = "The server commands: :shutdown (cancel with nothing planned, a countdown: INFO_HOTEL_CLOSING to everyone, at login and instead of a purchase; cancelled: maintenance_cancelled; a bad number: the default minutes), :usersonline, :uptime, :reload catalogue (the room's heightmap and the catalogue index to everyone) and :reload games"

# Room 7 (ballroom, no NPCs). s = tracestaff (ADMINISTRATOR, instance 0), a = tracebot1
# (instance 1), b = tracebot2 (instance 2, logs in during the countdown). Commands are never chat:
# nobody looks, so no look timer.
# :uptime's text has the uptime and the process's memory (the JVM's in Java), so its ALERT is
# checked by header only. The player peaks are counted every 10 s from the server's start;
# :usersonline comes after the count that sees s and a.
# Java's countdown would close the hotel (System.exit) when it ends, so each one is cancelled.

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "s"
send = "CHAT"
args = [":shutdown cancel"]
note = "Nothing planned: Java throws, nothing is sent"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "s"
send = "CHAT"
args = [":shutdown 30"]
note = "INFO_HOTEL_CLOSING 30 to everyone online, the whisper to s"

[[steps]]
bot = "b"
macro = "login"
note = "INFO_HOTEL_CLOSING 30 at login"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 653, "", false]
settle_ms = 800
note = "A purchase during the countdown: INFO_HOTEL_CLOSING, nothing bought"

[[steps]]
bot = "a"
send = "GET_CREDITS"
note = "Still 1000 credits"

[[steps]]
bot = "s"
send = "CHAT"
args = [":shutdown off"]
note = "maintenance_cancelled to everyone, the whisper to s"

[[steps]]
bot = "s"
send = "CHAT"
args = [":shutdown soon"]
note = "Not a number: the default (shutdown.minutes, 1) and both whispers"

[[steps]]
bot = "s"
send = "CHAT"
args = [":SHUTDOWN STOP"]
note = "Cancelled again"

[[steps]]
bot = "s"
send = "CHAT"
args = [":shutdown"]
note = "No minutes: the default"

[[steps]]
bot = "s"
send = "CHAT"
args = [":shutdown Cancel"]
settle_ms = 10500
note = "The next player count sees all three"

[[steps]]
bot = "s"
send = "CHAT"
args = [":usersonline"]
note = "Everyone in the order they logged in, and the daily peak"

[[steps]]
bot = "a"
send = "CHAT"
args = [":whosonline"]
note = "A normal user may, too"

[[steps]]
bot = "s"
send = "CHAT"
args = [":uptime"]
header_only = ["ALERT"]
note = "The uptime, the players and peaks, the games and the system"

[[steps]]
bot = "s"
send = "CHAT"
args = [":reload catalogue"]
note = "The room's HEIGHTMAP_UPDATE, the catalogue index to everyone online, the alert"

[[steps]]
bot = "s"
send = "CHAT"
args = [":reload shop"]

[[steps]]
bot = "s"
send = "CHAT"
args = [":reload games"]
note = "Games have been reloaded."

[[steps]]
bot = "b"
disconnect = true

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "s"
disconnect = true
