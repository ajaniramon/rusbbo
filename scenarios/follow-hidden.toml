name = "follow-hidden"
description = "Following a friend into a public room hidden from the navigator (Room.forward with followRedirect): the forward goes to the room whose walkway leads there; a visible public room forwards to itself"

# a (tracebot1) and b (tracebot2) become friends. Public room 20 (Oldskool Dancefloor) is hidden
# (is_hidden, navigator.show.hidden.rooms off); the walkway from room 19 (Oldskool Lounge) leads
# into it. Room 7 is visible.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "MESSENGERINIT"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "MESSENGERINIT"

[[steps]]
bot = "a"
send = "MESSENGER_REQUESTBUDDY"
args = ["tracebot2"]

[[steps]]
bot = "b"
send = "MESSENGER_ACCEPTBUDDY"
args = [1, 1]
note = "a and b are friends"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 20]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "FOLLOW_FRIEND"
args = [1]
note = "a is in hidden room 20: ROOMFORWARD to room 19 (1019)"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "FOLLOW_FRIEND"
args = [1]
note = "a visible room: ROOMFORWARD to room 7 (1007)"
