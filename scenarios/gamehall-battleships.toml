name = "gamehall-battleships"
description = "The Battleships hall (room 63, hallB): a game started alone and joined, PLACESHIP (bad ship type, one too many), the start once both placed ten ships (OPPONENTS, TURN), SHOOT out of turn, a miss (the turn passes 2 s later), hits keeping the turn (HIT, HITTWICE, SINK, SITUATION grids), sinking every ship (GAMEEND, GAMEOVER), no shots after, CLOSE and leaving the room"

# hallB: door 1,0; the nearest table's chairs are 2,4 and 2,6 (BattleShipsTrigger). No NPCs.
# Both fleets: carrier 0,0-4,0; battleships 0,2-3,2 and 0,4-3,4; cruisers 0,6-2,6, 0,8-2,8 and
# 0,10-2,10; destroyers 6,0-7,0, 6,2-7,2, 6,4-7,4 and 6,6-7,6. `$gameid` is the bot's game id.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 63]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 63]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "a"
send = "WALK"
args = [2, 4]
wait_for = ["OPENGAMEBOARD"]
settle_ms = 1500
note = "One player starts the game"

[[steps]]
bot = "b"
send = "WALK"
args = [2, 6]
wait_for = ["OPENGAMEBOARD"]
settle_ms = 1500
note = "b joins it"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid PLACESHIP 9 0 0 1 0" }]
note = "No such ship: nothing"

[[steps]]
