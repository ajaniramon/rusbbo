name = "gamehall-chess-draw"
description = "Draws in the Chess hall (room 64), with chesslib: the knights back and forth, the start position four times and no draw, RESTART, and Sam Loyd's ten-move stalemate (chesslib's isDraw counts it, so it is the draw line too)"

# hallC: see gamehall-chess-mate.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 64]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 64]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "a"
send = "WALK"
args = [2, 7]
settle_ms = 3500

[[steps]]
bot = "b"
send = "WALK"
args = [2, 9]
wait_for = ["OPENGAMEBOARD"]
settle_ms = 1500
note = "The game starts for both"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid CHOOSETYPE w" }]
note = "a is white, b black"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g1 f3" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g8 f6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f3 g1" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f6 g8" }]
note = "The start position again"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g1 f3" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g8 f6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f3 g1" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f6 g8" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g1 f3" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g8 f6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f3 g1" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f6 g8" }]
note = "The fourth time: still no draw (no repetition in chesslib 1.1.1 as Havana uses it)"

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e7 e5" }]
note = "Not b's turn: TYPERESERVED"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid RESTART" }]
note = "A new board"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e2 e3" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a7 a5" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE d1 h5" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a8 a6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE h5 a5" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE h7 h5" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE h2 h4" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a6 h6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a5 c7" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f7 f6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE c7 d7" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e8 f7" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE d7 b7" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE d8 d3" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE b7 b8" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE d3 h7" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE b8 c8" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f7 g6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE c8 e6" }]
note = "Stalemate: black cannot move and is not in check"

[[steps]]
bot = "b"
send = "QUIT"
settle_ms = 800

[[steps]]
bot = "a"
send = "QUIT"

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true
