name = "snowstorm-reward"
description = "The credits a SnowStorm game rewards (reward.credits.winner.range 7-7, loser.range 3-3), handed out on the next 1 s game tick after GAMEEND; otherwise snowstorm-game: a game end to end on arena 4 (two teams): STARTGAME (GAMELOCATION, the tickets, the started game to an observer), entering the arena (ROOM_DIRECTORY -1, the map's HEIGHTMAP, FULLGAMESTATUS and OBJECTS_WORLD on G_HMAP), SNOWSTORM_GAMESTATUS every 300 ms, no events before GAMESTART, walking (GAMEEVENT 0), a long throw at a player and its hit, a quick throw that hits, a short throw at a tile, making a snowball (GAMEEVENT 3), REQUESTFULLGAMESTATUS, three instant hits (trajectory 3) that stun, no throwing while stunned, GAMEEND with the scores, the finished game for the observer, back to the lobby and the points"

# A copy of snowstorm-game.toml with fixed credit rewards; the step after GAMEEND waits 1.5 s
# for the game tick that hands them out.
# The SnowStorm lobby is room 67. s (tracestaff) shortens the game with :setconfig (4 s to prepare,
# 19 s to play), turns off the same-IP check, so the game is scored, and the winner's credits.
#
# Timing: the arena's task sends SNOWSTORM_GAMESTATUS every 300 ms from the first player's entry,
# and from then on every step takes one of those turns: it ends 225 ms after the turn, so the next
# request arrives 75 ms before the next turn and its events go out in it. STARTGAME's step waits
# 250 ms, so that the game's 1 s timers (GAMESTART, then GAMEEND 18 s later) fall about 150 ms
# after a turn; their step then takes one more turn.
#
# Spawns are random in Java (any walkable tile of arena 4), so the FULLGAMESTATUS of G_HMAP and the
# turns while the players walk to their tiles are checked by header only. From anywhere on arena
# 4, a walks to 23,24 and b to 27,24 in at most 24 turns (Java's greedy walk; the Rust unit test
# `every_spawn_of_arena_4_reaches_the_scenario_tiles` checks every spawn), and arriving faces 0;
# from then on everything is fixed: a is object 1 and b object 2 (arena 4 has no machines),
# snowballs are 3 onwards, and the throws land (Java's flight steps) about 100 ms (long, 4 tiles)
# and 250 ms (quick) after a turn. One walkable tile of arena 4 (0,22) is an island: a run where
# Java spawns a player there fails (1 in 1241 per player).

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 67]
settle_ms = 600

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig snowstorm.preparing.game.seconds 4"]
settle_ms = 600

[[steps]]
