args = [":setconfig games.same.ip.check.enabled false"]
settle_ms = 600

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig reward.credits.winner.range 7-7"]
settle_ms = 600

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig reward.credits.loser.range 3-3"]
settle_ms = 600

