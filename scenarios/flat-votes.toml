name = "flat-votes"
description = "Room ratings: RATEFLAT (bad answers, twice, by the owner), UPDATE_VOTES on entry and after a vote (to the owner and the voters), voters matched by IP address and new users, a negative rating shown as 0, and the rating ordering the navigator"

# c (tracebot3) owns rooms 1000 and 1001 in category 114. a (tracebot1) and b (tracebot2) joined
# the hotel in 2026 and may vote; c and d (tracebot4) joined in 2099, less than an hour ago as
# far as Java is concerned (Room.hasVoted). Every bot connects from 127.0.0.1, so once a voted,
# b counts as having voted too (the users_ip_logs match).

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[bots]]
name = "d"
ticket = "trace-sso-4"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "CREATEFLAT"
args = ["Vote Flat A", "model_a", "open", true]
note = "Room 1000"

[[steps]]
bot = "c"
send = "CREATEFLAT"
args = ["Vote Flat B", "model_a", "open", true]
note = "Room 1001"

[[steps]]
bot = "c"
send = "SETFLATCAT"
args = [1000, 114]

[[steps]]
bot = "c"
send = "SETFLATCAT"
args = [1001, 114]

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "NAVIGATE"
args = [0, 114]
note = "Both rooms empty and unrated"

[[steps]]
bot = "c"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "c"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "The owner: UPDATE_VOTES with the rating (0)"
ignore_status = ["flatctrl"]

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_USRS"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_ITEMS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 1200
ignore_status = ["flatctrl"]

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "a has not voted: UPDATE_VOTES -1"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "RATEFLAT"
args = [2]
note = "Not 1 or -1: ignored"

[[steps]]
bot = "a"
send = "RATEFLAT"
args = [1]
note = "The owner and a (who voted) get UPDATE_VOTES 1"

[[steps]]
bot = "a"
send = "RATEFLAT"
args = [1]
note = "Voted already: ignored"

[[steps]]
bot = "c"
send = "RATEFLAT"
args = [1]
note = "The owner may not vote: ignored"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "b"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "b has the IP address a voted from: counts as voted, UPDATE_VOTES 1"

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_OBJS"

[[steps]]
bot = "b"
send = "G_ITEMS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "RATEFLAT"
args = [-1]
note = "Counts as voted: ignored"

[[steps]]
bot = "d"
macro = "login"

[[steps]]
bot = "d"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "d"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "d joined the hotel less than an hour ago (created in 2099): counts as voted"

[[steps]]
bot = "d"
send = "G_HMAP"

[[steps]]
bot = "d"
send = "G_USRS"

[[steps]]
bot = "d"
send = "G_OBJS"

[[steps]]
bot = "d"
send = "G_ITEMS"

[[steps]]
bot = "d"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "NAVIGATE"
args = [0, 114]

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1001, ""]

[[steps]]
bot = "b"
send = "GOTOFLAT"
args = [1001]
settle_ms = 600
note = "Nobody voted in room 1001: UPDATE_VOTES -1"

[[steps]]
