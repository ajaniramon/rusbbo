args = [-1]
note = "A rating below 0 is 0: UPDATE_VOTES 0"

[[steps]]
bot = "a"
send = "QUIT"

[[steps]]
bot = "b"
send = "QUIT"

[[steps]]
bot = "c"
send = "QUIT"

[[steps]]
bot = "d"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "a"
send = "NAVIGATE"
args = [0, 114]
note = "Both empty: the rated room 1000 first (Java lists 1001 first while both are unrated)"

[[steps]]
bot = "a"
send = "SRCHF"
args = ["Vote"]

[[steps]]
bot = "c"
send = "SUSERF"

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "Back in: a voted, UPDATE_VOTES 1"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
