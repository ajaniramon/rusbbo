name = "collectables"
description = "Collectables cycles (CollectablesManager): the store and admin pages list only the active item, with the layout its price gives; buying the active item without seeing its admin page; another item of the admin page refused for a user, sold to staff; a Collectible transaction"

# catalogue_collectables: store page 51 sells admin page 83's svnr_de (catalogue item 1320,
# position 0 of its cycle), store page 93 sells admin page 94's planet_of_love (1420); 1347
# (SF_alien) is another item of page 83. 200 credits and 100 pixels each, which nobody here has
# in pixels: NO_CREDITS shows the price check was reached. oracle/seed.sql
# pushes both expiries to 2100, so the cycles stay put. a = tracebot1 (a user), s = tracestaff
# (ADMINISTRATOR). Admin pages need rank 6.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GET_CATALOGUE_PAGE"
args = [51]
note = "the store page: only the active item, layout cars (coins and pixels)"

[[steps]]
bot = "a"
send = "GET_CATALOGUE_PAGE"
args = [83]
note = "the admin page: above a user's rank"

[[steps]]
bot = "a"
send = "GET_CATALOGUE_PAGE"
args = [93]

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 1320, "", false]
note = "the active item, from an admin page the user cannot see: priced (NO_CREDITS, pixels)"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 1347, "", false]
note = "another item of the admin page: refused"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 1420, "", false]
note = "the pixel collectable"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "GET_CATALOGUE_PAGE"
args = [83]
note = "the admin page lists only the active item too"

[[steps]]
bot = "s"
send = "GRPC"
args = [0, 1347, "", false]
note = "staff may buy the admin page's other items (NO_CREDITS: pixels)"
