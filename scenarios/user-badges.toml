name = "user-badges"
description = "Badge list and wearing badges: the list is sent once per login, SETBADGE rules (slots, unknown codes, replacing), GETSELECTEDBADGES outside a room"

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "GETAVAILABLEBADGES"
note = "first call after login: list, then achievement processing"

[[steps]]
bot = "c"
send = "GETAVAILABLEBADGES"
note = "second call: Java answers nothing"

[[steps]]
bot = "c"
send = "GETSELECTEDBADGES"
args = [3]
note = "outside a room: no answer"

[[steps]]
bot = "c"
send = "SETBADGE"
args = [1, 'TB1', 2, 'TB3']
note = "wear two"

[[steps]]
bot = "c"
send = "SETBADGE"
args = [1, 'TB4', 5, 'TB1', 6, 'TB2', 0, 'TB3']
note = "slot 6 and 0 are ignored; wearing replaces everything"

[[steps]]
bot = "c"
send = "SETBADGE"
args = [2, 'NOPE', 3, 'tb2', 4, '']
note = "unknown code ignored, code match is case-insensitive, empty code ignored"

[[steps]]
bot = "c"
send = "SETBADGE"
args = [1, 'TB1', 1, 'TB2']
note = "two badges in one slot"

[[steps]]
bot = "c"
send = "SETBADGE"
args = []
note = "take everything off"

[[steps]]
bot = "c"
send = "GETAVAILABLEBADGES"

