name = "walkway-others"
description = "A user taking a walkway while another stays behind: what the room left behind sees (Java's old room still sends the walker's status, as it is in the new room) and what the new room's users see"

# Room 19 (Oldskool Lounge) has a walkway tile at (16,18) into room 20 (Oldskool Dancefloor,
# arriving at (15,18)). a = tracebot1 walks through; b = tracebot2 stays in room 19; c =
# tracebot3 waits in room 20.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 20]
settle_ms = 600

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_USRS"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 19]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_OBJS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 19]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "WALK"
args = [16, 18]
settle_ms = 9000
note = "onto the walkway: a leaves for room 20"
