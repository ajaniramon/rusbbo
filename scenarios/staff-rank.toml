name = "staff-rank"
description = "A staff command above the user's rank: a moderator's :givecredits is plain chat, heard (and looked at) by the others, with the look timer's last status"

# Split from staff-commands, whose staff bot would otherwise stay connected past Java's 60 s PING.
# Room 7 (ballroom, no NPCs). s = tracestaff (ADMINISTRATOR, instance 0), a = tracebot1
# (instance 1), m = tracemod (MODERATOR, instance 2).

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "m"
ticket = "trace-sso-22"

