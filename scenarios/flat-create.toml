name = "flat-create"
description = "Create a guest room with the room kiosk, set its details and category, find it in the navigator, enter it as the owner, walk, change its settings from inside and leave"

# The golden database has no guest rooms of the bots and the `rooms` table's AUTO_INCREMENT is 1000,
# so the room created here is always room 1000.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GETUSERFLATCATS"
note = "Room kiosk: the category drop-down"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Trace Flat", "model_a", "open", true]
note = "Room kiosk step 1: name, layout, door mode, show owner -> GOTO_FLAT(1000, name)"

[[steps]]
bot = "a"
send = "SETFLATINFO"
args = [1000, "A room made by a trace bot", "", 0, 25]
note = "Room kiosk step 2: description, password, 'everyone has rights' off, max visitors"

[[steps]]
bot = "a"
send = "SETFLATCAT"
args = [1000, 114]
note = "Chill, Chat & Discussion Rooms (no answer)"

[[steps]]
bot = "a"
send = "GETFLATCAT"
args = [1000]

[[steps]]
bot = "a"
send = "SUSERF"
note = "Navigator: own rooms lists the new room"

[[steps]]
bot = "a"
send = "SRCHF"
args = ["Trace"]
note = "Navigator search finds it by name"

[[steps]]
bot = "a"
send = "GETFLATINFO"
args = [1000]
note = "Navigator room info pane"

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]
note = "Go to the room: the owner is let in straight away (FLAT_LETIN)"

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600
note = "ROOM_READY, FLATPROPERTY, owner/controller rights, votes, event info"

[[steps]]
bot = "a"
send = "GETROOMAD"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"
note = "Wall items (none)"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200
note = "Users and statuses: the owner stands in the door with flatctrl useradmin"

[[steps]]
bot = "a"
send = "WALK"
args = [8, 9]
settle_ms = 1500
note = "Walk from the door (3,5) into the room until the status updates stop"

[[steps]]
bot = "a"
send = "GETFLATINFO"
args = [1000]
note = "Room settings dialog from inside the room"

[[steps]]
bot = "a"
send = "UPDATEFLAT"
args = [1000, "Trace Flat Renamed", "open", false]
note = "Rename, keep it open, hide the owner name"

[[steps]]
bot = "a"
send = "SETFLATINFO"
args = [1000, "New description", "", 1, 30]
note = "Everyone has rights on, 30 visitors"

[[steps]]
bot = "a"
send = "GETFLATINFO"
args = [1000]
note = "Settings changed on the loaded room"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "a"
send = "SUSERF"
note = "Own rooms shows the new name"

[[steps]]
bot = "a"
send = "SRCHF"
args = ["Renamed"]
