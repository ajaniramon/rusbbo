name = "groups-room"
description = "Groups in rooms: the favourite group in USER_OBJECTS, G_STAT's GROUP_MEMBERSHIP_UPDATE and GROUP_BADGES (owner, administrator), favourites that are not a joined group reset at login, GET_GROUP_BADGES, GET_GROUP_INFO (home room, unknown group), GET_USER_TAGS, the room entry badge, and RCON refresh_tags, refreshgroupperms, refreshgroup, groupdeleted, refreshroombadges"

# Room 4 (TV Studio, entry badge ENT). o = gowner (26, owns group 50), m = gmember (27,
# administrator of 50), p = gpending (28, favourite 51 while pending), l = gleft (29, favourite 52).

[[bots]]
name = "o"
ticket = "trace-sso-26"

[[bots]]
name = "m"
ticket = "trace-sso-27"

[[bots]]
name = "p"
ticket = "trace-sso-28"

[[bots]]
name = "l"
ticket = "trace-sso-29"

[[steps]]
bot = "o"
macro = "login"

[[steps]]
bot = "o"
send = "ROOM_DIRECTORY"
args = [true, 4]
settle_ms = 600

[[steps]]
bot = "o"
send = "G_HMAP"

[[steps]]
bot = "o"
send = "G_USRS"

[[steps]]
bot = "o"
send = "G_OBJS"

[[steps]]
bot = "o"
send = "G_STAT"
settle_ms = 2500

[[steps]]
bot = "m"
macro = "login"

[[steps]]
bot = "m"
send = "ROOM_DIRECTORY"
args = [true, 4]
settle_ms = 600

[[steps]]
bot = "m"
send = "G_HMAP"

[[steps]]
bot = "m"
send = "G_USRS"

[[steps]]
bot = "m"
send = "G_OBJS"

[[steps]]
bot = "m"
send = "G_STAT"
settle_ms = 2500

[[steps]]
bot = "p"
macro = "login"

[[steps]]
bot = "p"
send = "ROOM_DIRECTORY"
args = [true, 4]
settle_ms = 600

[[steps]]
bot = "p"
send = "G_HMAP"

[[steps]]
bot = "p"
send = "G_USRS"

[[steps]]
bot = "p"
send = "G_OBJS"

[[steps]]
bot = "p"
send = "G_STAT"
settle_ms = 2500

[[steps]]
bot = "l"
macro = "login"

[[steps]]
bot = "l"
send = "ROOM_DIRECTORY"
args = [true, 4]
settle_ms = 600

[[steps]]
bot = "l"
send = "G_HMAP"

[[steps]]
bot = "l"
send = "G_USRS"

[[steps]]
bot = "l"
send = "G_OBJS"

[[steps]]
bot = "l"
send = "G_STAT"
settle_ms = 2500

[[steps]]
bot = "m"
send = "GET_GROUP_BADGES"
note = "the favourites of the room that m has joined"

[[steps]]
bot = "p"
send = "GET_GROUP_BADGES"
note = "p has joined none of them"

[[steps]]
bot = "m"
send = "GET_GROUP_INFO"
args = [50]
note = "the home room is room 4"

[[steps]]
bot = "p"
send = "GET_GROUP_INFO"
args = [51]
note = "nobody in the room has joined 51"

[[steps]]
bot = "m"
send = "GET_USER_TAGS"
args = [26]

[[steps]]
bot = "m"
send = "GET_USER_TAGS"
args = [999]
note = "not online"

[[steps]]
bot = "o"
rcon = "refresh_tags"
rcon_values = { userId = "26" }
settle_ms = 800

[[steps]]
bot = "m"
rcon = "refreshgroupperms"
rcon_values = { userId = "27" }
settle_ms = 800

[[steps]]
bot = "m"
rcon = "refreshgroup"
rcon_values = { groupId = "50" }
settle_ms = 600

[[steps]]
bot = "o"
rcon = "refreshroombadges"
note = "everyone already has ENT"
settle_ms = 800

[[steps]]
bot = "o"
rcon = "groupdeleted"
rcon_values = { groupId = "50" }
settle_ms = 800

[[steps]]
bot = "m"
send = "GET_GROUP_BADGES"
note = "no favourites left"

[[steps]]
bot = "l"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "l"
send = "ROOM_DIRECTORY"
args = [true, 4]
settle_ms = 600

[[steps]]
bot = "l"
send = "G_HMAP"

[[steps]]
bot = "l"
send = "G_USRS"

[[steps]]
bot = "l"
send = "G_OBJS"

[[steps]]
bot = "l"
send = "G_STAT"
settle_ms = 2500
