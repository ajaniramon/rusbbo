name = "infobus-poll"
description = "The Infobus's poll and the end of the event, over RCON: infobuspoll sends POLL_QUESTION to everyone in the bus who has not answered; VOTE out of range, a vote, a second vote ignored; VOTE_RESULTS to the bus 30 s later, and again on every new vote; the poll asked again (nobody left to ask); infobusendevent: CANNOT_ENTER_BUS, a walks out through the bus's walkway into the park and b, at the bus's door, is sent to the hotel view; in the park G_STAT shows the closed door and the message again"

# The Infobus is room 35 (park_b, door 11,2, its walkway leads to The Park, room 34, at 28,5);
# neither room has an NPC. oracle/seed.sql has poll 1 (three answers). The 30 s until the results
# are spent in quiet steps (b sends VOTE 0, which does nothing); each step lasts at most 10 s.
# b stays on the bus's door tile, so the end of the event sends b straight to the hotel view: a
# second user arriving through the walkway in a park that is already running would get its first
# status from whichever room task runs first (a Java race between the two rooms' threads).

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 35]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_STAT"

[[steps]]
bot = "a"
send = "WALK"
args = [9, 2]
settle_ms = 800

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 35]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_STAT"

[[steps]]
bot = "a"
rcon = "infobuspoll"
rcon_values = { pollId = "1" }
note = "POLL_QUESTION to a and b"

[[steps]]
bot = "a"
send = "VOTE"
args = [0]
note = "Out of range: answers are 1-3"

[[steps]]
bot = "a"
send = "VOTE"
args = [4]

[[steps]]
bot = "a"
send = "VOTE"
args = [2]
note = "Stored; the results are not out yet"

[[steps]]
bot = "a"
send = "VOTE"
args = [1]
note = "Already answered"

[[steps]]
bot = "b"
send = "VOTE"
args = [0]
settle_ms = 9500

[[steps]]
bot = "b"
send = "VOTE"
args = [0]
settle_ms = 9500

[[steps]]
bot = "b"
send = "VOTE"
args = [0]
settle_ms = 8000

[[steps]]
bot = "b"
send = "VOTE"
args = [0]
wait_for = ["VOTE_RESULTS"]
note = "VOTE_RESULTS, 30 s after the poll started"

[[steps]]
bot = "b"
send = "VOTE"
args = [3]
note = "Results are out, so every vote shows them again"

[[steps]]
bot = "a"
rcon = "infobuspoll"
rcon_values = { pollId = "1" }
note = "Asked again: both answered, so nobody gets the question"

[[steps]]
bot = "a"
rcon = "infobuspoll"
rcon_values = { pollId = "2" }
note = "No such poll: nothing, and no poll to vote on"

[[steps]]
bot = "a"
send = "VOTE"
args = [1]

[[steps]]
bot = "a"
rcon = "infobuspoll"
rcon_values = { pollId = "1" }

[[steps]]
bot = "a"
rcon = "infobusendevent"
settle_ms = 1500
note = "CANNOT_ENTER_BUS to both: a walks to the exit and through the walkway into the park, b (at the door) leaves to the hotel view"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_STAT"
note = "BUS_DOOR closed, then CANNOT_ENTER_BUS again"

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 34]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_STAT"
note = "b too: BUS_DOOR closed, then CANNOT_ENTER_BUS again"

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true
