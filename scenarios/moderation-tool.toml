# --- User actions ---

[[steps]]
bot = "a"
send = "MODERATORACTION"
args = [0, 0, "Hi", "notes", "tracebot2"]
note = "No fuse_room_alert: nothing"

[[steps]]
bot = "s"
send = "MODERATORACTION"
args = [0, 0, "Please behave", "first warning", "tracebot1"]

[[steps]]
bot = "s"
send = "MODERATORACTION"
args = [0, 0, "Hello?", "", "nobody"]

[[steps]]
bot = "m"
send = "MODERATORACTION"
args = [0, 1, "Out", "", "tracestaff"]
note = "The target may kick too: modtool_rankerror"

[[steps]]
bot = "s"
send = "MODERATORACTION"
args = [0, 1, "Out you go", "kick notes", "tracebot1"]
settle_ms = 2500
note = "a walks to the door and leaves"

[[steps]]
bot = "s"
send = "MODERATORACTION"
args = [0, 1, "Again", "", "tracebot1"]
note = "a is in no room: Java throws, nothing is sent"

