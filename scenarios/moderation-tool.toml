name = "moderation-tool"
description = "The in-client moderation tool (MODERATORACTION): alert a user, kick a user, room alert, room kick, ban (and what it refuses), and a normal user who sends it"

# Room 7 (ballroom, no NPCs). s = tracestaff (ADMINISTRATOR), m = tracemod (MODERATOR), a =
# tracebot1, b = tracebot2. MODERATORACTION: target type (0 user, 1 room), action type (user:
# 0 alert, 1 kick, 2 ban; room: 0 alert, 1 kick), the alert message and notes, then for user
# actions the name, and for a ban the hours and two booleans (ban the machine id, ban the IP:
# ignored, as in Java).
# A kicked user walks to the door and leaves (HOTEL_VIEW, then MODERATOR_ALERT).

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "m"
ticket = "trace-sso-22"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
