args = [1, 0, "Room alert", "room notes"]

[[steps]]
bot = "s"
send = "MODERATORACTION"
args = [1, 1, "Room closed", ""]
settle_ms = 2500
note = "b leaves; s and m have fuse_room_kick and stay"

# --- Ban ---

[[steps]]
bot = "s"
send = "MODERATORACTION"
args = [0, 2, "Banned by the tool", "ban notes", "tracebot1", 2, true, false]
note = "a is disconnected (no HOTEL_LOGOUT)"

