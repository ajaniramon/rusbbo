name = "flat-teleport"
description = "Teleporters: a pair bought from the catalogue, used inside one flat (walk to the front, step in, come out of the other), then a second pair linking two flats (ROOMFORWARD, entering on the far teleporter), watched by a second user"

# tracebot1 (a) owns flats 1000 'Tele One' and 1001 'Tele Two'; tracebot2 (b) waits in 1001, which
# keeps it loaded (Java only links to a teleporter whose room is loaded).
# Each 'door' purchase (catalogue item 22) gives two linked items; virtual ids in purchase order:
# pair 1 = items 1 and 2, pair 2 = items 3 and 4.
# 'door' has redirect_rotation_2: always rotation 2, so the square in front is x + 1.
# The teleport runs on Java scheduler timers (0, 1, 1.5, 3, 4 s after the click) between room
# ticks, so those steps settle for a long time.
# model_a: door at (3,5), floor x 4-11, y 1-13.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 22, "", false]
note = "Teleporter pair 1"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 22, "", false]
note = "Teleporter pair 2"

[[steps]]
bot = "a"
send = "GETSTRIP"
args = [3]
note = "Four teleporters in the hand"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Tele One", "model_a", "open", true]

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Tele Two", "model_a", "open", true]

# --- Flat 1001: the far end of pair 2 ---


[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1001, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1001]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1001, ""]
note = "b stays in 1001 for the rest of the scenario"

[[steps]]
bot = "b"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1001]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_OBJS"

[[steps]]
bot = "b"
send = "G_ITEMS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["4 5 7 2"]
note = "Item 4 at (5,7); its front is (6,7)"

# --- Flat 1000 ---


[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]
note = "a leaves 1001 (b sees LOGOUT)"

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["1 5 3 0"]
note = "Item 1 at (5,3), rotation forced to 2"

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["2 5 9 2"]
note = "Item 2 at (5,9)"

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["3 9 5 2"]
note = "Item 3 at (9,5)"

# --- Teleporting inside the flat ---


[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 2500
note = "Not touching: a walks to the square in front of item 1"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 3000
note = "Item 1 opens, a steps in, effects, a is warped onto item 2, which opens and lets a out to (6,9); both close"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 2500
note = "Far from item 1 again: walk back to its front"

# --- Teleporting to the other flat ---


[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 0]
settle_ms = 2500
note = "Walk to the front of item 3"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 0]
settle_ms = 3000
note = "Item 3 opens, a steps in; after 1.5 s LOGOUT in 1000 and ROOMFORWARD to flat 1001"

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1001, ""]
note = "The client follows the forward"

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1001]
settle_ms = 2500
note = "a appears on item 4 (not at the door), which shows effects, opens, lets a out to (6,7) and closes"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "b"
send = "QUIT"
settle_ms = 600
