name = "user-settings"
description = "Account preferences and the sound setting; CHANGE_LOOKS is Flash only, so a Shockwave client changes nothing"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GET_ACCOUNT_PREFERENCES"

[[steps]]
bot = "a"
send = "SET_SOUND_SETTING"
args = [false]
note = "no answer"

[[steps]]
bot = "a"
send = "GET_ACCOUNT_PREFERENCES"

[[steps]]
bot = "a"
send = "SET_SOUND_SETTING"
args = [true]

[[steps]]
bot = "a"
send = "GET_ACCOUNT_PREFERENCES"

[[steps]]
bot = "a"
send = "CHANGE_LOOKS"
args = ["F", "hd-600-1.ch-630-62.lg-695-62.sh-725-68.hr-515-33"]
note = "outside a room: ignored"

[[steps]]
bot = "a"
send = "GET_INFO"
note = "figure and sex unchanged"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "CHANGE_LOOKS"
args = ["F", "hd-600-1.ch-630-62.lg-695-62.sh-725-68.hr-515-33"]
note = "in a room: ignored, the connection is not Flash"

[[steps]]
bot = "a"
send = "GET_INFO"
note = "still unchanged"

[[steps]]
bot = "a"
send = "QUIT"

