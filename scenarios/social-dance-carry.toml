name = "social-dance-carry"
description = "Dancing (club styles refused to non-club users), STOP, carrying drinks and items (CARRYDRINK, CARRYITEM), dancing drops the drink"

# Room 7 (ballroom, no NPCs). a = tracebot1 (no club, instance 0), d = tracebot4 (Habbo Club, instance 1).
# Public rooms let anyone carry any drink id (RoomPlayer.canCarry). A drink switches to the
# 'drink' action after 12 s, so every carry here ends within a few seconds.
# Java pings every connection 60 s after it opens and drops it 60 s later without a PONG (which
# would also run the achievement check), so each bot's part of the scenario stays well under 60 s.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "d"
ticket = "trace-sso-4"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "WALK"
args = [12, 8]
settle_ms = 2500

[[steps]]
bot = "d"
macro = "login"

[[steps]]
bot = "d"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "d"
send = "G_HMAP"

[[steps]]
bot = "d"
send = "G_USRS"

[[steps]]
bot = "d"
send = "G_OBJS"

[[steps]]
bot = "d"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "d"
send = "WALK"
args = [14, 8]
settle_ms = 2500

# --- Dancing ---


[[steps]]
bot = "a"
send = "DANCE"
args = [1]
settle_ms = 800
note = "Dance 1 is for everyone"

[[steps]]
bot = "a"
send = "DANCE"
args = [3]
settle_ms = 800
note = "Club dance from a non-club user: ignored, a keeps dancing 1"

[[steps]]
bot = "d"
send = "DANCE"
args = [3]
settle_ms = 800
note = "Club member: dance 3"

[[steps]]
bot = "a"
send = "STOP"
args = [{ raw = "Dance" }]
settle_ms = 800
note = "STOP takes the raw body 'Dance'"

[[steps]]
bot = "d"
send = "DANCE"
args = [0]
settle_ms = 800
note = "Dance 0 stops"

# --- Carrying ---


[[steps]]
bot = "a"
send = "CARRYDRINK"
args = [5]
settle_ms = 800
note = "carryd status on the next tick"

[[steps]]
bot = "a"
send = "DANCE"
args = [1]
settle_ms = 800
note = "Dancing drops the drink: the user is sent again (USER_OBJECTS, USER_STATUSES, USER_DANCE)"

[[steps]]
bot = "a"
send = "STOP"
args = [{ raw = "Dance" }]
settle_ms = 800

[[steps]]
bot = "a"
send = "CARRYITEM"
args = [6]
settle_ms = 800

[[steps]]
bot = "a"
send = "STOP"
args = [{ raw = "CarryItem" }]
settle_ms = 800
note = "STOP CarryItem"

[[steps]]
bot = "a"
send = "CARRYDRINK"
args = [7]
settle_ms = 800

[[steps]]
bot = "a"
send = "CARRYDRINK"
args = [0]
settle_ms = 800
note = "CARRYDRINK 0 stops carrying"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "d"
send = "QUIT"
settle_ms = 600
