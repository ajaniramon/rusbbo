name = "moderation-login"
description = "Hotel bans at login (a user id ban, a machine id ban; expired and lifted bans do not count) and TRY_LOGIN with a password (wrong, then right with another letter case)"

# Users from oracle/seed.sql: tracebanned (23) has an active USER_ID ban, tracemachine (24) a stored
# machine id with an active MACHINE_ID ban, tracepass (25) the password "tracepass123" (an
# Argon2 hash written by Java's Argon2PasswordEncoder) and an expired and an inactive ban.
# Java (Player.login) lets a banned user log in, then sees the ban and kicks them: HOTEL_LOGOUT
# and the connection closes. Nothing else is sent before that.
# Java checks Argon2 hashes with 64 MiB of memory, slowly: TRY_LOGIN steps wait 1.5 s.

[[bots]]
name = "banned"
ticket = "trace-sso-23"

[[bots]]
name = "machine"
ticket = "trace-sso-24"

[[bots]]
name = "pass"
ticket = "no-ticket"

[[steps]]
bot = "banned"
macro = "login"
note = "USER_ID ban: HOTEL_LOGOUT and closed"

[[steps]]
bot = "machine"
macro = "login"
note = "MACHINE_ID ban on the stored machine id: HOTEL_LOGOUT and closed"

[[steps]]
bot = "pass"
connect = true

[[steps]]
bot = "pass"
send = "INIT_CRYPTO"

[[steps]]
bot = "pass"
send = "UNIQUEID"
args = ["trace-machine"]

[[steps]]
bot = "pass"
send = "TRY_LOGIN"
args = ["tracepass", "wrong-password"]
settle_ms = 1500
note = "LOCALISED_ERROR Login incorrect; the connection stays open"

[[steps]]
bot = "pass"
send = "TRY_LOGIN"
args = ["nobody", "tracepass123"]
settle_ms = 1500
note = "Unknown user: the same error"

[[steps]]
bot = "pass"
send = "TRY_LOGIN"
args = ["TracePass", "tracepass123"]
settle_ms = 1500
note = "Logged in (the user name matches in any case); its expired and inactive bans do not count"

[[steps]]
bot = "pass"
send = "GET_INFO"

[[steps]]
bot = "pass"
send = "TRY_LOGIN"
args = ["tracepass", "tracepass123"]
settle_ms = 1500
note = "Already logged in: nothing"

[[steps]]
bot = "pass"
disconnect = true
