name = "flat-events"
description = "Room events: CAN_CREATE_ROOMEVENT, GET_ROOMEVENT_TYPE_COUNT, CREATE_ROOMEVENT (out of a room, bad categories, twice), ROOMEEVENT_INFO to the room and on entry, GET_ROOMEVENTS_BY_TYPE, EDIT_ROOMEVENT and QUIT_ROOMEVENT (by the owner and by a visitor), and the event ending when its room unloads"

# a (tracebot1) owns room 1000; b (tracebot2) visits; c (tracebot3) logs in after the room unloaded.
# Event dates are written with the clock and masked by the harness.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "CAN_CREATE_ROOMEVENT"
note = "In no room: false"

[[steps]]
bot = "a"
send = "GET_ROOMEVENT_TYPE_COUNT"
note = "events.category.count"

[[steps]]
bot = "a"
send = "CREATE_ROOMEVENT"
args = [1, "Nowhere", "no room"]
note = "In no room: ignored"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Event Flat", "model_a", "open", true]
note = "Room 1000"

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "No event: ROOMEEVENT_INFO -1"
ignore_status = ["flatctrl"]

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200
ignore_status = ["flatctrl"]

[[steps]]
bot = "a"
send = "CAN_CREATE_ROOMEVENT"
note = "The owner, no event: true"

[[steps]]
bot = "a"
send = "CREATE_ROOMEVENT"
args = [0, "Zero", "category 0"]
note = "Category out of range: ignored"

[[steps]]
bot = "a"
send = "CREATE_ROOMEVENT"
args = [12, "Twelve", "category 12"]
note = "Category out of range: ignored"

[[steps]]
bot = "a"
send = "CREATE_ROOMEVENT"
args = [3, "Aaron's party", "Everyone\rwelcome"]
note = "The room gets ROOMEEVENT_INFO; the word filter and filterInput apply"

[[steps]]
bot = "a"
send = "CAN_CREATE_ROOMEVENT"
note = "Hosting one already: false"

[[steps]]
bot = "a"
send = "CREATE_ROOMEVENT"
args = [4, "Second", "again"]
note = "Hosting one already: ignored"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [3]

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [0]
note = "0 is every event, the busiest first"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [5]
note = "None of that type"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [12]
note = "Out of range: nothing"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [-1]
note = "Out of range: nothing"

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "b"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600
note = "b enters: ROOMEEVENT_INFO with the event"

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_OBJS"

[[steps]]
bot = "b"
send = "G_ITEMS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "CAN_CREATE_ROOMEVENT"
note = "Not the owner: false"

[[steps]]
bot = "b"
send = "EDIT_ROOMEVENT"
args = [4, "Hijacked", "by b"]
note = "Not the owner: ignored"

[[steps]]
bot = "b"
send = "QUIT_ROOMEVENT"
note = "Not the owner: ignored"

[[steps]]
bot = "a"
send = "EDIT_ROOMEVENT"
args = [0, "Bad", "category"]
note = "Category out of range: ignored"

[[steps]]
bot = "a"
send = "EDIT_ROOMEVENT"
args = [4, "Trace party II", "Bring a friend"]
note = "Both get the new ROOMEEVENT_INFO"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [4]

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [3]
note = "Moved to type 4"

[[steps]]
bot = "a"
send = "QUIT_ROOMEVENT"
note = "Both get ROOMEEVENT_INFO -1"

[[steps]]
bot = "a"
send = "QUIT_ROOMEVENT"
note = "No event: ignored"

[[steps]]
bot = "a"
send = "EDIT_ROOMEVENT"
args = [4, "Gone", "gone"]
note = "No event: ignored"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [0]
note = "No events"

[[steps]]
bot = "a"
send = "CAN_CREATE_ROOMEVENT"
note = "true again"

[[steps]]
bot = "a"
send = "CREATE_ROOMEVENT"
args = [5, "Last one", "until the room unloads"]

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [5]

[[steps]]
bot = "b"
send = "QUIT"

[[steps]]
bot = "a"
send = "QUIT"

[[steps]]
bot = "b"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [0]
note = "The room is empty but still loaded: the event is still on"

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true
settle_ms = 32000
note = "Room 1000 unloads 30 s after the last user left (room.dispose.timer.seconds), and its event goes with it"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [5]
note = "The event is gone"

[[steps]]
bot = "c"
send = "GET_ROOMEVENTS_BY_TYPE"
args = [0]

[[steps]]
bot = "c"
disconnect = true
