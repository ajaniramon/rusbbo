name = "flat-vending"
description = "A vending machine (walk to its front, then the user turns to it, it opens, hands out its drink after 1 s and closes after 2 s), the hockey light (lert), the scoreboard (USEFURNITURE status 0/1/2, rights only), the fortune teller (random after 1.5 s, off again) and SET_RANDOM_STATE"

# Flat 1000 belongs to tracebot1 (a); tracebot2 (b) visits without rights.
# Items: 1 sink (catalogue 164, vending machine, drink 18), 2 hockey_light (162, lert),
# 3 hockey_score (189, scoreboard), 4 fortune (1331), 5 lamp_armas (123).
# The sink at (8,3) facing south (front square (8,4)), the light at (9,4), the scoreboard at
# (7,4), the fortune teller at (8,6), the lamp at (5,8). model_a: door at (3,5).

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GRPC"
wait_for = ["CREDIT_BALANCE"]
args = [0, 164, "", false]
note = "sink: item 1"

[[steps]]
bot = "a"
send = "GRPC"
wait_for = ["CREDIT_BALANCE"]
args = [0, 162, "", false]
note = "hockey_light: item 2"

[[steps]]
bot = "a"
send = "GRPC"
wait_for = ["CREDIT_BALANCE"]
args = [0, 189, "", false]
note = "hockey_score: item 3"

[[steps]]
bot = "a"
send = "GRPC"
wait_for = ["CREDIT_BALANCE"]
args = [0, 1331, "", false]
note = "fortune: item 4"

[[steps]]
bot = "a"
send = "GRPC"
wait_for = ["CREDIT_BALANCE"]
args = [0, 123, "", false]
note = "lamp_armas: item 5"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Vending Flat", "model_a", "open", true]

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["1 8 3 4"]

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["2 9 4 0"]

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["3 7 4 4"]

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["4 8 6 0"]

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["5 5 8 0"]

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 3500
note = "Far from the sink: walk to its front square (8,4)"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 2500
note = "Turns north, the sink opens (1), carryd 18 after 1 s, closed (0) after 2 s"

[[steps]]
bot = "a"
send = "CARRYDRINK"
args = [0]
note = "Drops the drink"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [2, 0]
note = "The light flashes: 0, 1, 0"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 2]
note = "Scoreboard +1"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 2]
note = "Scoreboard +1"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 1]
note = "Scoreboard -1"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 1]
note = "Scoreboard -1"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 1]
note = "Scoreboard below 0: 99"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 0]
note = "Scoreboard off (x)"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [3, 0]
note = "Scoreboard on (0)"

[[steps]]
bot = "a"
send = "SET_RANDOM_STATE"
args = [5]
note = "The lamp toggles like USEFURNITURE"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "b"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_OBJS"

[[steps]]
bot = "b"
send = "G_ITEMS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "WALK"
args = [6, 4]
settle_ms = 2000
note = "Next to the scoreboard"

[[steps]]
bot = "b"
send = "USEFURNITURE"
args = [3, 2]
note = "No rights: the scoreboard ignores it"

[[steps]]
bot = "b"
send = "USEFURNITURE"
args = [4, 0]
note = "The fortune teller: -1, b turns to it"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [4, 0]
note = "Still turning: ignored"

[[steps]]
bot = "a"
send = 288
settle_ms = 1800
header_only = [88]
note = "The fortune's random state 1.5 s later"

[[steps]]
bot = "a"
send = "USEFURNITURE"
args = [4, 0]
note = "a turns to it, it goes off (8)"

[[steps]]
bot = "b"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600
