name = "chat-filter"
description = "Word filter on chat, shout and whisper: per receiver for filterable words, for everyone for the mandatory ones"

# Room 7 (ballroom, no NPCs). a = tracebot1 (word filter on, instance 0), f = tracebot6 (word
# filter off, instance 1). wordfilter table: 'aaron' is filterable (only for receivers with the
# filter on), 'zaphotel' is mandatory (is_filterable = 0: filtered for everyone). The replacement is
# 'bobba', and filtering lowercases the whole sentence.
# Chat makes the other bot look at the speaker (within 14 tiles; a shout at any distance), and the
# look timer sends one more status 6-7 s after the last look: the shout, last of the chat steps,
# waits 8 s and takes in both bots' updates.
# Java pings every connection 60 s after it opens and drops it 60 s later without a PONG (which
# would also run the achievement check), so each bot's part of the scenario stays well under 60 s.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "f"
ticket = "trace-sso-6"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "WALK"
args = [12, 8]
settle_ms = 2500

[[steps]]
bot = "f"
macro = "login"

[[steps]]
bot = "f"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "f"
send = "G_HMAP"

[[steps]]
bot = "f"
send = "G_USRS"

[[steps]]
bot = "f"
send = "G_OBJS"

[[steps]]
bot = "f"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "f"
send = "WALK"
args = [16, 8]
settle_ms = 2500

# --- Word filter ---


[[steps]]
bot = "a"
send = "CHAT"
args = ["Ask Aaron about it"]
settle_ms = 800
note = "a (filter on) gets 'ask bobba about it'; f (filter off) gets it unchanged"

[[steps]]
bot = "f"
send = "CHAT"
args = ["AARON was here"]
settle_ms = 800
note = "The speaker's own setting does not matter: f sees it unchanged, a filtered"

[[steps]]
bot = "a"
send = "CHAT"
args = ["Visit ZapHotel now"]
settle_ms = 800
note = "Mandatory word: 'visit bobba now' for everyone"

[[steps]]
bot = "a"
send = "CHAT"
args = ["zaphotel"]
settle_ms = 800
note = "Nothing but a mandatory word"

[[steps]]
bot = "a"
send = "WHISPER"
args = ["tracebot6 aaron says hi"]
note = "Whisper: each receiver by their own setting"

[[steps]]
bot = "a"
send = "SHOUT"
args = ["AARON!"]
settle_ms = 8000
note = "Shout is filtered the same way"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "f"
send = "QUIT"
settle_ms = 600
