name = "flat-decor"
description = "Buy a wallpaper and a floor, apply them in your own room from the hand, then leave and come back to see them on room entry"

# Room 1000 is tracebot1's (a). Item 1 is the wallpaper (pattern 201), item 2 the floor (pattern
# 110). For decoration items the custom data is the purchase's extra data, not the catalogue item's
# special sprite id.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 251, "201", false]
note = "wallpaper (Spaces page), 2 credits; the client sends the chosen pattern as extra data"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 1, "110", false]
note = "floor (Spaces page), 2 credits; the client sends the chosen pattern as extra data"

[[steps]]
bot = "a"
send = "GETSTRIP"
args = [3]

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Decor Flat", "model_a", "open", true]

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600
note = "No wallpaper/floor yet: only the landscape FLATPROPERTY"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "FLATPROPBYITEM"
args = [1]
note = "Apply the wallpaper: FLATPROPERTY to the room, the item is used up, hand refreshed"

[[steps]]
bot = "a"
send = "FLATPROPBYITEM"
args = [2]
note = "Apply the floor"

[[steps]]
bot = "a"
send = "FLATPROPBYITEM"
args = [1]
note = "Item 1 is gone: ignored"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600
note = "Room entry now carries the wallpaper and floor FLATPROPERTY too"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600
