name = "battleball-reload"
description = ":reload games in the BattleBall lobby: the waiting game drops out of the game manager (not listed, not observable, not startable, not joinable), its creator can make a new game, which gets the next id, and its player joins it from the lost game; a second :reload games"

# The BattleBall lobby is room 66 (bb_lobby_1); nobody sends G_STAT, so its NPC never joins.
# a creates game 1 and b joins it; s (tracestaff) observes it and reloads the games. Java's
# GameManager.reset makes a new manager: the old games are not in its list any more, the game
# counter carries on, and the finished games (none here) are numbered from 0 again.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "a"
send = 159
note = "GETINSTANCELIST: no games"

[[steps]]
bot = "a"
send = "INITIATECREATEGAME"
note = "GAMEPARAMETERS"

[[steps]]
bot = "a"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", false, 1, "numTeams", false, 2, "allowedPowerups", true, "1,2,3,4,5,6,7,8", "name", true, "Before reload"]
note = "Game 1"

[[steps]]
bot = "b"
send = "INITIATEJOINGAME"
args = [1, 1]
note = "b joins team 1"

[[steps]]
bot = "s"
send = "OBSERVEINSTANCE"
args = [1]
note = "s observes game 1"

[[steps]]
bot = "s"
send = "CHAT"
args = [":reload games"]
note = "Games have been reloaded."

[[steps]]
bot = "a"
send = 159
note = "No games any more"

[[steps]]
bot = "s"
send = "OBSERVEINSTANCE"
args = [1]
note = "No game 1: nothing"

[[steps]]
bot = "a"
send = "STARTGAME"
note = "a's game is not found: nothing"

[[steps]]
bot = "b"
send = "INITIATEJOINGAME"
args = [1, 0]
note = "No game 1: nothing"

[[steps]]
bot = "a"
send = "INITIATECREATEGAME"
note = "a may make a game again"

[[steps]]
bot = "a"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", false, 1, "numTeams", false, 2, "allowedPowerups", true, "1,2,3,4,5,6,7,8", "name", true, "After reload"]
note = "Game 2: the counter went on"

[[steps]]
bot = "b"
send = "INITIATEJOINGAME"
args = [2, 1]
note = "b leaves the lost game (no game to tell) and joins game 2"

[[steps]]
bot = "s"
send = 159
note = "Game 2 is listed"

[[steps]]
bot = "s"
send = "CHAT"
args = [":reload games"]
note = "Again: game 2 drops out too"

[[steps]]
bot = "b"
send = "LEAVEGAME"
note = "Its game is not found: nothing"

[[steps]]
bot = "a"
send = 159
note = "No games"

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true

[[steps]]
bot = "s"
disconnect = true
