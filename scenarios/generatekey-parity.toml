name = "generatekey-parity"
description = "GENERATEKEY corners: a second one on an encrypted connection (answered, encrypted, with the same public key; the first cipher stays), a zero shared secret (SECRET_KEY, still plain), a key that is not a number (nothing), and BigInteger's leading - and +"

[[bots]]
name = "e"
ticket = "trace-sso-1"
encrypt = true

[[bots]]
name = "z"
ticket = "trace-sso-2"

[[bots]]
name = "x"
ticket = "trace-sso-3"

[[bots]]
name = "m"
ticket = "trace-sso-4"

[[bots]]
name = "p"
ticket = "trace-sso-5"

[[steps]]
bot = "e"
connect = true

[[steps]]
bot = "e"
send = "INIT_CRYPTO"

[[steps]]
bot = "e"
send = "GENERATEKEY"
header_only = ["SECRET_KEY"]
args = ["$public_key"]
wait_for = ["SECRET_KEY"]
note = "SECRET_KEY in plain text, then the RC4 layer"

[[steps]]
bot = "e"
send = "GENERATEKEY"
header_only = ["SECRET_KEY"]
args = ["5"]
note = "again, encrypted: SECRET_KEY with the same public key; the first cipher stays"

[[steps]]
bot = "e"
send = "UNIQUEID"
args = ["trace-machine"]

[[steps]]
bot = "e"
send = "SSO"
args = ["$ticket"]
settle_ms = 1500
note = "the connection still works"

[[steps]]
bot = "z"
connect = true

[[steps]]
bot = "z"
send = "INIT_CRYPTO"

[[steps]]
bot = "z"
send = "GENERATEKEY"
header_only = ["SECRET_KEY"]
args = ["0"]
note = "a zero secret: SECRET_KEY, and the connection stays plain"

[[steps]]
bot = "z"
send = "UNIQUEID"
args = ["trace-machine"]

[[steps]]
bot = "z"
send = "SSO"
args = ["$ticket"]
settle_ms = 1500

[[steps]]
bot = "x"
connect = true

[[steps]]
bot = "x"
send = "INIT_CRYPTO"

[[steps]]
bot = "x"
send = "GENERATEKEY"
header_only = ["SECRET_KEY"]
args = ["12a"]
note = "not a number: nothing"

[[steps]]
bot = "x"
send = "UNIQUEID"
args = ["trace-machine"]

[[steps]]
bot = "x"
send = "SSO"
args = ["$ticket"]
settle_ms = 1500
note = "still plain"

[[steps]]
bot = "m"
connect = true

[[steps]]
bot = "m"
send = "INIT_CRYPTO"

[[steps]]
bot = "m"
send = "GENERATEKEY"
header_only = ["SECRET_KEY"]
args = ["-12345"]
note = "a negative key is a number for BigInteger: SECRET_KEY, then the RC4 layer"

[[steps]]
bot = "m"
disconnect = true

[[steps]]
bot = "p"
connect = true

[[steps]]
bot = "p"
send = "INIT_CRYPTO"

[[steps]]
bot = "p"
send = "GENERATEKEY"
header_only = ["SECRET_KEY"]
args = ["+12345"]
note = "and so is a leading plus"

[[steps]]
bot = "p"
disconnect = true
