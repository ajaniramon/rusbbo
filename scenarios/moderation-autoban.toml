name = "moderation-autoban"
description = "The word filter's automatic ban (chat, shout, console message), the word filter on console messages (mandatory words for everyone, filterable words for receivers with the filter on), a muted console sender, and the ban seen by a moderator"

# tracebot3-6 were created in 2099, so Java's hasBannableSentence (only users who joined at most
# 30 minutes ago) applies to them. 'h4bb0 id' and 'h4bb0.id' are bannable, 'zaphotel' mandatory,
# 'aaron' filterable (wordfilter table). A banned user's connection is closed without
# HOTEL_LOGOUT (BanManager.disconnectBanAccounts).
# c = tracebot3, d = tracebot4 (room 7); e = tracebot5 (word filter on), f = tracebot6 (word
# filter off) are friends on the console; s = tracestaff.

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[bots]]
name = "d"
ticket = "trace-sso-4"

[[bots]]
name = "e"
ticket = "trace-sso-5"

[[bots]]
name = "f"
ticket = "trace-sso-6"

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_USRS"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "d"
macro = "login"

[[steps]]
bot = "d"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "d"
send = "G_HMAP"

[[steps]]
bot = "d"
send = "G_USRS"

[[steps]]
bot = "d"
send = "G_OBJS"

[[steps]]
bot = "d"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "c"
send = "CHAT"
args = ["my h4bb0 id is secret"]
settle_ms = 800
note = "Banned and closed; d sees c leave"

[[steps]]
bot = "d"
send = "SHOUT"
args = ["H4BB0 ID!!"]
settle_ms = 800
note = "Any letter case"

# --- Console ---

[[steps]]
bot = "e"
macro = "login"

[[steps]]
bot = "e"
send = "MESSENGERINIT"

[[steps]]
bot = "f"
macro = "login"

[[steps]]
bot = "f"
send = "MESSENGERINIT"

[[steps]]
bot = "e"
send = "MESSENGER_REQUESTBUDDY"
args = ["tracebot6"]

[[steps]]
bot = "f"
send = "MESSENGER_ACCEPTBUDDY"
args = [1, 5]

[[steps]]
bot = "e"
send = "MESSENGER_SENDMSG"
args = [6, "Ask Aaron about ZapHotel"]
note = "f has the filter off: only the mandatory word (and the sentence is lowercased)"

[[steps]]
bot = "f"
send = "MESSENGER_SENDMSG"
args = [5, "Aaron says hi"]
note = "e has the filter on: every word"

[[steps]]
bot = "f"
send = "MESSENGER_SENDMSG"
args = [5, "   "]
note = "Blank: nothing"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_OBJS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "s"
send = "CHAT"
args = [":mute tracebot6 5"]

[[steps]]
bot = "f"
send = "MESSENGER_SENDMSG"
args = [5, "can you hear me"]
note = "Muted: ALERT, no message"

[[steps]]
bot = "e"
send = "MESSENGER_SENDMSG"
args = [6, "visit h4bb0.id"]
settle_ms = 800
note = "Banned on the console too"

[[steps]]
bot = "s"
send = "CHAT"
args = [":ban tracebot3 10 Again"]
note = "The automatic ban is stored"

[[steps]]
bot = "s"
send = "CHAT"
args = [":unban tracebot4"]

[[steps]]
bot = "s"
send = "CHAT"
args = [":ban tracebot4 10 Again"]
note = "Unbanned, so it can be banned again"

[[steps]]
bot = "f"
disconnect = true

[[steps]]
bot = "s"
disconnect = true
