name = "flat-roller"
description = "A roller in a flat moves a user standing on it and an item placed on it one square on (SLIDEOBJECTBUNDLE); then :pickall empties the room"

# Flat 1000 belongs to tracebot1. Items: 1 queue_tile1 (roller, catalogue item 1723), 2 chair_plasto.
# The roller sits at (6,6) with rotation 4, so it moves things to (6,7).
# Rollers run on their own room task every 2 s (roller.tick.default), with a phase that is not tied
# to the steps, so every step that involves the roller waits long enough to contain one whole roll.
# model_a: door at (3,5), floor x 4-11, y 1-13.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 1723, "", false]
note = "queue_tile1: item 1"

[[steps]]
bot = "a"
send = "GRPC"
args = [0, 518, "", false]
note = "chair_plasto: item 2"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Roller Flat", "model_a", "open", true]

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "GETSTRIP"
args = [3]

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["1 6 6 4"]
settle_ms = 2500
note = "Roller at (6,6) facing south: nothing on it, nothing rolls"

[[steps]]
bot = "a"
send = "WALK"
args = [6, 6]
settle_ms = 4500
note = "Walk onto the roller: it carries a on to (6,7)"

[[steps]]
bot = "a"
send = "WALK"
args = [9, 9]
settle_ms = 3000
note = "Off to the side"

[[steps]]
bot = "a"
send = "PLACESTUFF"
args = ["2 6 6 0"]
settle_ms = 4500
note = "Chair placed on the roller: it rolls to (6,7)"

[[steps]]
bot = "a"
send = "MOVESTUFF"
args = [2, 6, 6, 2]
settle_ms = 4500
note = "Chair moved back onto the roller: it rolls again"

[[steps]]
bot = "a"
send = "CHAT"
args = [":pickall"]
settle_ms = 1000
note = "Owner command: every item goes back to the hand"

[[steps]]
bot = "a"
send = "GETSTRIP"
args = [3]

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600
