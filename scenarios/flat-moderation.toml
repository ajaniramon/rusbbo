name = "flat-moderation"
description = "Moderation in a flat: the word filter on room names and descriptions (CREATEFLAT, SETFLATINFO, UPDATEFLAT), banning a visitor from the room (BANUSER) and what it refuses, and :unacceptable"

# Room 1000 is tracebot1's (a). b = tracebot2 visits, m = tracemod (MODERATOR, fuse_kick).
# Room names and descriptions go through WordfilterManager.filterSentence: every filter word,
# and the whole text lowercased when one matches. BANUSER (Shockwave: the bare name as the body)
# sends the target CANTCONNECT (banned), kicks them, and bans them from the room for 6 hours.
# model_a: door at (3,5).

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "m"
ticket = "trace-sso-22"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Aaron Place", "model_a", "open", true]
note = "Named 'bobba place'"

[[steps]]
bot = "a"
send = "SETFLATINFO"
args = [1000, "Ask Aaron about ZapHotel", "", 0, 25]

[[steps]]
bot = "a"
send = "GETFLATINFO"
args = [1000]

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "UPDATEFLAT"
args = [1000, "The AARON room", "open", true]

[[steps]]
bot = "a"
send = "GETFLATINFO"
args = [1000]

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "b"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_OBJS"

[[steps]]
bot = "b"
send = "G_ITEMS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "b"
send = "WALK"
args = [8, 8]
settle_ms = 2000

[[steps]]
bot = "m"
macro = "login"

[[steps]]
bot = "m"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "m"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600

[[steps]]
bot = "m"
send = "G_HMAP"

[[steps]]
bot = "m"
send = "G_USRS"

[[steps]]
bot = "m"
send = "G_OBJS"

[[steps]]
bot = "m"
send = "G_ITEMS"

[[steps]]
bot = "m"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "m"
send = "WALK"
args = [6, 10]
settle_ms = 2000

# --- BANUSER ---

[[steps]]
bot = "b"
send = "BANUSER"
args = [{ raw = "tracemod" }]
note = "b is neither owner nor moderator: modtool_rankerror"

[[steps]]
bot = "a"
send = "BANUSER"
args = [{ raw = "tracemod" }]
note = "The target may kick: modtool_rankerror"

[[steps]]
bot = "m"
send = "BANUSER"
args = [{ raw = "tracebot1" }]
note = "The owner cannot be banned from their room"

[[steps]]
bot = "a"
send = "BANUSER"
args = [{ raw = "tracebot1" }]
note = "Oneself: nothing"

[[steps]]
bot = "a"
send = "BANUSER"
args = [{ raw = "nobody" }]

[[steps]]
bot = "a"
send = "BANUSER"
args = [{ raw = "tracebot2" }]
settle_ms = 2500
note = "b: CANTCONNECT (banned), walks out"

[[steps]]
bot = "b"
send = "TRYFLAT"
args = [1000, ""]
note = "Banned from the room"

# --- :unacceptable ---

[[steps]]
bot = "m"
send = "CHAT"
args = [":unacceptable name"]

[[steps]]
bot = "m"
send = "CHAT"
args = [":unacceptable desc"]

[[steps]]
bot = "m"
send = "CHAT"
args = [":unacceptable nothing"]
note = "Unknown target: nothing"

[[steps]]
bot = "m"
send = "CHAT"
args = [":unacceptable both"]

[[steps]]
bot = "a"
send = "GETFLATINFO"
args = [1000]

[[steps]]
bot = "b"
disconnect = true

[[steps]]
