name = "pool-ladders"
description = "Lido B (pool_b) ladders: down into the water at 17,21 (swim, warp to 17,22, on to 17,23, SHOWPROGRAM Splash0), back up at 17,22, down again, and swimming through the walkway into the Habbo Lido, where the arrival in the water (z 1) swims (habbo_lido_trigger)"

# a (tracebot1) gets a pool figure in the Habbo Lido (36, pool_a) and goes to Lido B (37, pool_b,
# door 9,21). Neither room is sent G_STAT until the end: Lido B's first G_STAT starts the diving
# camera (random) and the Habbo Lido's adds its NPC. The water walkway 16,29 of Lido B leads to
# 34,19 (z 1) in the Habbo Lido.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 36]
settle_ms = 600

[[steps]]
bot = "a"
send = "SWIMSUIT"
args = [{ raw = "ch=s02/238,238,238" }]

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 37]
settle_ms = 600

[[steps]]
bot = "a"
send = "WALK"
args = [17, 21]
settle_ms = 1500
note = "Down the ladder: swim, on to 17,23"

[[steps]]
bot = "a"
send = "WALK"
args = [17, 22]
settle_ms = 1500
note = "Up the ladder: out of the water at 17,21, on to 17,20"

[[steps]]
bot = "a"
send = "WALK"
args = [17, 21]
settle_ms = 1500
note = "Down again"

[[steps]]
bot = "a"
send = "WALK"
args = [16, 29]
settle_ms = 1500
note = "Swimming into the walkway to the Habbo Lido"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200
note = "Arrived in the water at z 1: swim"

[[steps]]
bot = "a"
send = "QUIT"
