name = "pool-no-stat"
description = "Leaving Lido B when nobody ever sent G_STAT there: Java's DivingDeckTrigger.onRoomLeave finds no camera task and throws, so the rest of leaveRoom never runs (no LOGOUT for the others, no hotel view, the room user keeps the room); entering another room afterwards works"

# a = tracebot1 and b = tracebot2 enter Lido B (room 37) without G_STAT; a quits, then enters
# room 7.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 37]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 37]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 800
note = "Java throws in the trigger: nothing for a, no LOGOUT for b"

[[steps]]
bot = "a"
send = "QUIT"
settle_ms = 600
note = "a is no longer one of the room's users: nothing"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200
note = "room 7 as usual"
