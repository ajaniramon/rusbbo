name = "rooms-carry"
description = "What Java's room user keeps from room to room (RoomEntity.reset leaves it): :teleport and :itemdebug, and the chat flood mute"

# s = tracestaff turns on :teleport and :itemdebug in room 7 and walks in room 2 (Theatredome);
# a = tracebot1 floods the chat in room 7 until muted (six lines), then chats in room 2.

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_OBJS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "s"
send = "CHAT"
args = [":teleport"]
note = "teleport mode on"

[[steps]]
bot = "s"
send = "CHAT"
args = [":itemdebug"]
note = "item debug on"

[[steps]]
bot = "s"
send = "QUIT"
settle_ms = 600

