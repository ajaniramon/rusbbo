name = "welcome-alert"
description = "The welcome message at login (welcome.message.enabled, set with :setconfig): StringUtil.replaceAlertMessage's line breaks and %username%, for a Shockwave and a Flash client"

# s = tracestaff (ADMINISTRATOR) sets the message; a = tracebot1 (Shockwave) and f = tracebot2
# (Flash) log in after it.

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "f"
ticket = "trace-sso-2"
flash = true

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_OBJS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig welcome.message.content Hello\r\n%username%,\rwelcome\nback<br>%username%"]

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig welcome.message.enabled true"]

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "f"
macro = "login"
header_only = ["SESSION_PARAMETERS"]
