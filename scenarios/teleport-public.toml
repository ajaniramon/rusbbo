name = "teleport-public"
description = "A teleporter pair between a flat and a public room (placed by staff): stepping into the flat's teleporter forwards through Room.forward to the hidden Chromide Club II, so to its walkway's room (Chromide Club, 1021) with the public offset"

# s = tracestaff (ADMINISTRATOR: may place furniture anywhere) buys a door pair (catalogue item
# 22: items 1 and 2), puts item 2 in the Chromide Club II (room 22, hidden; its walkway comes
# from room 21) and item 1 in its new flat 1000. a = tracebot1 waits in room 22, which keeps it
# loaded (Java links only to a loaded room). A teleporter used inside a public room does nothing,
# in Java too. model_a: door at (3,5).

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "GRPC"
args = [0, 22, "", false]
wait_for = ["CREDIT_BALANCE"]
note = "door: items 1 and 2"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 22]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_OBJS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "s"
send = "PLACESTUFF"
args = ["2 12 10 2"]
settle_ms = 600
note = "item 2 in the Chromide Club II"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 22]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "s"
send = "CREATEFLAT"
args = ["Tele Flat", "model_a", "open", true]

[[steps]]
bot = "s"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "s"
send = "GOTOFLAT"
ignore_status = ["flatctrl"]
args = [1000]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_OBJS"

[[steps]]
bot = "s"
send = "G_ITEMS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "s"
send = "PLACESTUFF"
args = ["1 6 5 2"]
settle_ms = 600
note = "item 1 in flat 1000, its front (7,5)"

[[steps]]
bot = "s"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 2500
note = "not touching: s walks to the front"

[[steps]]
bot = "s"
send = "USEFURNITURE"
args = [1, 0]
settle_ms = 4500
note = "in, LOGOUT, and ROOMFORWARD to 1021 (room 22 is hidden: its walkway's room)"
