name = "club-gifts"
description = "Club gifts and small requests: SCR_GIFT_APPROVAL gives the gifts due (the club sofa first, then the first of the gift order), GET_ALIAS_LIST, GET_FURNI_VERSIONS, GETUSERCREDITLOG (nothing), and PURCHASE_AND_WEAR of a free effect in a room"

# c = gclub (32): a club member with two gifts due and no gift yet. The presents' wrapping is
# random, so the hand is compared by header only.

[[bots]]
name = "c"
ticket = "trace-sso-32"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "SCR_GIFT_APPROVAL"
settle_ms = 1000
header_only = ["INVENTORY"]

[[steps]]
bot = "c"
send = "SCR_GIFT_APPROVAL"
note = "none due any more"

[[steps]]
bot = "c"
send = "GET_ALIAS_LIST"

[[steps]]
bot = "c"
send = "GET_FURNI_VERSIONS"

[[steps]]
bot = "c"
send = "GETUSERCREDITLOG"

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 2]
settle_ms = 600

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_USRS"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "c"
send = "PURCHASE_AND_WEAR"
args = [0, 729]
settle_ms = 800
note = "avatar_effect1, free: bought, activated and worn"

[[steps]]
bot = "c"
send = "PURCHASE_AND_WEAR"
args = [0, 1]
note = "not an effect: nothing"
