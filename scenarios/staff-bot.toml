name = "staff-bot"
description = "The :bot command: random bots (BotDude<random>, random figures) at random free tiles of the room, seen by everyone there, and the task's first run, in which each walks to a random tile and dances, carries a drink or does neither; a bad amount; a normal user may not"

# Room 7 (ballroom, no NPCs). s = tracestaff (ADMINISTRATOR), a = tracebot1. Everything the bots
# do is random in Java (names, figures, tiles, dances, drinks), so their USER_OBJECTS, statuses
# and dances are checked by header only, and how many of them come varies.

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "s"
send = "G_HMAP"

[[steps]]
bot = "s"
send = "G_USRS"

[[steps]]
bot = "s"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "a"
send = "CHAT"
args = [":bot 1"]
settle_ms = 9500
note = "Above a's rank: an unknown command, so plain chat (and its look timer)"

[[steps]]
bot = "s"
send = "CHAT"
args = [":bot ten"]
note = "Not a number: Java's parseInt throws, nothing"

[[steps]]
bot = "s"
send = "CHAT"
args = [":bot 2"]
header_only = ["USER_OBJECTS", "USER_STATUSES", "USER_DANCE"]
note = "Two bots come in (USER_OBJECTS to both), and the task's first run sends them walking, dancing or carrying"

[[steps]]
bot = "s"
disconnect = true
header_only = ["USER_OBJECTS", "USER_STATUSES", "USER_DANCE"]

[[steps]]
bot = "a"
disconnect = true
header_only = ["USER_OBJECTS", "USER_STATUSES", "USER_DANCE"]
