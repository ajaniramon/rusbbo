name = "navigator-favourites"
description = "Favourite rooms: ADD_FAVORITE_ROOM (flats and public rooms, a duplicate, a room that does not exist), GETFVRF (newest first, owner names, the door of a gamehall room), DEL_FAVORITE_ROOM, another user's list, and the limit of 30 favourites"

# a (tracebot1) makes rooms 1000 (owner shown) and 1001 (owner hidden). Public rooms are sent as
# room id + 1000 with type 1. The Cunning Fox gamehall rooms (62-65) carry their door in the
# description ("cunning_fox_gamehall/1").

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Fav Flat One", "model_a", "open", true]
note = "Room 1000"

[[steps]]
bot = "a"
send = "CREATEFLAT"
args = ["Fav Flat Two", "model_a", "closed", false]
note = "Room 1001, owner hidden"

[[steps]]
bot = "a"
send = "GETFVRF"
note = "No favourites yet"

[[steps]]
bot = "a"
send = "ADD_FAVORITE_ROOM"
args = [0, 1001]

[[steps]]
bot = "a"
send = "ADD_FAVORITE_ROOM"
args = [1, 1062]
note = "TicTacToe hall (public room 62)"

