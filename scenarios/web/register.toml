description = "Registration: the form, a wrong captcha, a taken name, blank fields, cancelling; then /welcome, re-authentication and /account/banned for a user who is not banned"
# FigureUtil.getRandomFigure and the random number on the form.
mask = ['avatarimage\?figure=[^&"]*', 'name="randomFigure" value="[^"]*"', 'randomNum=\d+', 'captcha\.jpg\?t=\d+','"\d{1,4}"\);']

[[step]]
get = "/register"

[[step]]
post = "/register"
form = { "bean.avatarName" = "newbie1", "retypedPassword" = "secret123", "bean.email" = "newbie1@trace.local", "bean.day" = "1", "bean.month" = "2", "bean.year" = "1990", "bean.figure" = "hd-180-1.ch-210-66.lg-270-82.sh-290-91.hr-100-61", "bean.gender" = "M", "bean.captchaResponse" = "wrong", "bean.termsOfServiceSelection" = "true", "bean.spamMe" = "false" }

[[step]]
