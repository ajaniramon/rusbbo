# A friend visits: the private guestbook takes friends' entries, and they rate.
[[step]]
client = "b"
post = "/account/submit"
form = { username = "tracebot1", password = "tracepass123" }

[[step]]
client = "b"
get = "/home/tracepass"

# (a second later: entries are ordered by their creation second)
[[step]]
client = "b"
wait_ms = 1100
post = "/myhabbo/guestbook/add"
form = { widgetId = "10", message = "A visit from [i]tracebot1[/i]" }

[[step]]
client = "b"
get = "/myhabbo/rating/rate?ratingId=15&givenRate=4"

[[step]]
client = "b"
get = "/myhabbo/rating/rate?ratingId=15&givenRate=2"

[[step]]
client = "b"
get = "/myhabbo/rating/rate?ratingId=15&givenRate=9"

[[step]]
client = "b"
post = "/myhabbo/sticker/remove_sticker"
form = { stickerId = "16" }

# Back to the owner: the page as it is, removing an entry, resetting ratings, editing again.
[[step]]
get = "/home/tracepass"

[[step]]
post = "/myhabbo/guestbook/remove"
form = { entryId = "1", widgetId = "10" }

[[step]]
get = "/myhabbo/rating/reset_ratings?ratingId=15"

[[step]]
get = "/myhabbo/startSession/25"

[[step]]
