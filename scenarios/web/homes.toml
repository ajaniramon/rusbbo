description = "Habbo Homes: viewing pages (default, stored, other users', hidden), editing sessions, the web store and purchases, the inventory, placing and moving stickers, notes and widgets, skins, saving, the guestbook, ratings, the badge, friend and trax widgets, the link tool"
mask = ['\?\d{6,}"', '/c_images/banners/160x600/[^"]*"', '[A-Z][a-z]{2} \d\d, \d{4} \d{1,2}:\d\d:\d\d [AP]M']

# Not logged in: no session at all.
[[step]]
client = "anon"
get = "/home/tracepass"

[[step]]
post = "/account/submit"
form = { username = "tracepass", password = "tracepass123" }

# The default page (no home yet), another user's, by id, missing and banned ones.
