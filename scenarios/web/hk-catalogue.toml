mask = ['name="hk_token" value="[0-9a-f]{48}"', '\?\d{6,}"', '<span class="when">\d{4}-\d\d-\d\d \d\d:\d\d</span>', 'value="\d{4}-\d\d-\d\dT\d\d:\d\d"', 'data:image/png;base64,[A-Za-z0-9+/=]+', '\b1[7-9]\d{8}\b', '\d\d-\d\d-\d{4} \d\d:\d\d:\d\d']

