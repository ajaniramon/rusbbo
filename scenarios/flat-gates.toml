name = "flat-gates"
description = "A gate (solid while closed, opened and closed with USEFURNITURE) and a one-way door (ENTER_ONEWAY_DOOR from the square in front: open, walk through, closed after a second)"

# Flat 1000 belongs to tracebot5 (e: Habbo Club and 100 pixels; the One Way Gates page is club-only
# and its doors cost 15 credits and 30 pixels).
# Items: 1 one_way_door*1 (catalogue 1423), 2 exe_gate (catalogue 699).
# The one-way door at (6,9) with rotation 2: its front square is (7,9), the square behind (5,9).
# model_a: door at (3,5), floor x 4-11, y 1-13.

[[bots]]
name = "e"
ticket = "trace-sso-5"

[[steps]]
bot = "e"
macro = "login"

[[steps]]
bot = "e"
send = "GRPC"
args = [0, 1423, "", false]
note = "one_way_door*1: item 1"

[[steps]]
bot = "e"
send = "GRPC"
args = [0, 699, "", false]
note = "exe_gate: item 2"

[[steps]]
bot = "e"
send = "CREATEFLAT"
args = ["Gate Flat", "model_a", "open", true]

[[steps]]
bot = "e"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "e"
send = "GOTOFLAT"
args = [1000]
settle_ms = 600

[[steps]]
bot = "e"
send = "G_HMAP"

[[steps]]
bot = "e"
send = "G_USRS"

[[steps]]
bot = "e"
send = "G_OBJS"

[[steps]]
bot = "e"
send = "G_ITEMS"

[[steps]]
bot = "e"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "e"
send = "PLACESTUFF"
args = ["2 6 3 0"]
note = "Gate at (6,3), closed"

[[steps]]
bot = "e"
send = "PLACESTUFF"
args = ["1 6 9 2"]
note = "One-way door at (6,9)"

# --- Gate ---


[[steps]]
bot = "e"
send = "WALK"
args = [6, 3]
settle_ms = 1500
note = "Closed gate is solid: no path"

[[steps]]
bot = "e"
send = "USEFURNITURE"
args = [2, 0]
note = "Open"

[[steps]]
bot = "e"
send = "WALK"
args = [6, 3]
settle_ms = 2500
note = "Walk onto the open gate"

[[steps]]
bot = "e"
send = "USEFURNITURE"
args = [2, 0]
note = "Close it while standing in it"

[[steps]]
bot = "e"
send = "WALK"
args = [8, 3]
settle_ms = 2000

[[steps]]
bot = "e"
send = "USEFURNITURE"
args = [2, 0]

# --- One-way door ---


[[steps]]
bot = "e"
send = "WALK"
args = [7, 9]
settle_ms = 3000
note = "To the square in front of the door"

[[steps]]
bot = "e"
send = "ENTER_ONEWAY_DOOR"
args = [1]
settle_ms = 2500
note = "CHANGESTATUS open, walk through to (5,9), CHANGESTATUS closed after 1 s"

[[steps]]
bot = "e"
send = "ENTER_ONEWAY_DOOR"
args = [1]
settle_ms = 1500
note = "From behind: ignored"

[[steps]]
bot = "e"
send = "WALK"
args = [7, 9]
settle_ms = 2500
note = "The closed door blocks the way back: the path goes around it"

[[steps]]
bot = "e"
send = "QUIT"
settle_ms = 600
