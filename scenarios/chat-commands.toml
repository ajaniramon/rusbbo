name = "chat-commands"
description = "The chat commands a normal user can run (:about, :commands/:help, :givedrink, :dropdrink, :sit, :guidestatus, :afk), a command above the user's rank and an unknown one"

# Room 7 (ballroom, no NPCs). a = tracebot1 (instance 0), f = tracebot6 (instance 1).
# Commands are never chat: no TYPING_STATUS, nobody looks. A command the user may not run is
# ordinary chat, which makes f look at a; the look timer sends one more status 6-7 s after the
# last look, so the second such chat waits 8 s.
# Commands left out: :uptime/:status and :usersonline/:whosonline (uptime, daily peak and the
# online list depend on timing), :rgb (needs a room dimmer) and :pickall (flats only: see flat-roller).
# Java pings every connection 60 s after it opens and drops it 60 s later without a PONG (which
# would also run the achievement check), so each bot's part of the scenario stays well under 60 s.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "f"
ticket = "trace-sso-6"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "WALK"
args = [12, 8]
settle_ms = 2500

[[steps]]
bot = "f"
macro = "login"

[[steps]]
bot = "f"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "f"
send = "G_HMAP"

[[steps]]
bot = "f"
send = "G_USRS"

[[steps]]
bot = "f"
send = "G_OBJS"

[[steps]]
bot = "f"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "f"
send = "WALK"
args = [16, 8]
settle_ms = 2500

