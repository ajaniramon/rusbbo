name = "login-encrypted"
description = "Shockwave handshake with GENERATEKEY (RC4 layer), SSO login, then the first requests a client makes, all encrypted"

[[bots]]
name = "a"
ticket = "trace-sso-1"
encrypt = true

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "GET_INFO"

[[steps]]
bot = "a"
send = "GET_CREDITS"
