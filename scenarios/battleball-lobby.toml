name = "battleball-lobby"
description = "The BattleBall lobby (bb_lobby_1): LOUNGEINFO and GAMEPLAYERINFO on G_STAT, GETINSTANCELIST, INITIATECREATEGAME (GAMEPARAMETERS), GAMEPARAMETERVALUES (a bad map, a bad parameter, a game made), OBSERVEINSTANCE, INITIATEJOINGAME (bad team, joining, switching teams, a full team), STARTGAME (not the creator, one team only), KICKPLAYER, WATCHGAME and joining from there, LEAVEGAME, a second game, the creator leaving a waiting game (deleted for everyone), the ticket checks, UNOBSERVEINSTANCE and REQUEST_GAME_LOBBY"

# The BattleBall lobby is room 66 (bb_lobby_1, door 14,19). Its NPC (Xenia) joins with the first
# G_STAT and wanders from 3 s later, so the bots only send G_STAT at the end, one after the other
# (the game messages need no G_STAT). Game ids start at 1 (no games_played_history rows); the
# lobby's instance ids are a 0, b 1, c 2, s 3. s is tracestaff (an administrator), who raises the ticket price
# with :setconfig for the ticket checks at the end and puts it back. REQUEST_GAME_LOBBY picks
# the BattleBall or the SnowStorm lobby at random the first time (ThreadLocalRandom).

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[bots]]
name = "c"
ticket = "trace-sso-4"

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "a"
send = 159
note = "GETINSTANCELIST (and GETSELECTEDBADGES, which has no body): no games"

[[steps]]
bot = "a"
send = "INITIATECREATEGAME"
note = "GAMEPARAMETERS"

[[steps]]
bot = "a"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", false, 9, "numTeams", false, 2, "allowedPowerups", true, "1,2,3,4,5,6,7,8", "name", true, "Bad map"]
note = "Map 9 does not exist: no game, the room still gets INSTANCELIST"

[[steps]]
bot = "a"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", true, "1", "numTeams", false, 2, "allowedPowerups", true, "1,2,3,4,5,6,7,8", "name", true, "Text map"]
note = "fieldType as text: ClassCastException, nothing at all"

[[steps]]
bot = "a"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", false, 1, "numTeams", false, 2, "allowedPowerups", true, "1,2,3,4,5,6,7,8", "name", true, "Trace match"]
note = "Game 1: GAMEINSTANCE to a (the question mark power added), INSTANCELIST to the room"

[[steps]]
bot = "b"
send = "OBSERVEINSTANCE"
args = [1]

[[steps]]
bot = "b"
send = "OBSERVEINSTANCE"
args = [77]
note = "No such game, nor a finished one: nothing"

[[steps]]
bot = "b"
send = "INITIATEJOINGAME"
args = [1, 1]
note = "b joins team 1 (and stops being an observer)"

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "c"
send = "OBSERVEINSTANCE"
args = [1]

[[steps]]
bot = "c"
send = "INITIATEJOINGAME"
args = [1, 5]
note = "No team 5: nothing"

[[steps]]
bot = "c"
send = "INITIATEJOINGAME"
args = [1, 0]

[[steps]]
bot = "b"
send = "INITIATEJOINGAME"
args = [1, 0]
note = "b switches to team 0"

[[steps]]
bot = "b"
send = "STARTGAME"
note = "Not the creator: nothing"

[[steps]]
bot = "a"
send = "STARTGAME"
note = "Only one team has players: STARTFAILED"

[[steps]]
bot = "a"
send = "KICKPLAYER"
args = [2]
note = "c (instance 2) is kicked: GAMEDELETED and CREATEFAILED 6 to c"

[[steps]]
bot = "c"
send = "WATCHGAME"
args = [1]
note = "c spectates the waiting game"

[[steps]]
bot = "c"
send = "INITIATEJOINGAME"
args = [1, 1]
note = "From spectator to team 1: the spectator leaves first (GAMEDELETED)"

[[steps]]
bot = "b"
send = "LEAVEGAME"

[[steps]]
bot = "b"
send = 159

[[steps]]
bot = "b"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", false, 5, "numTeams", false, 4, "allowedPowerups", true, "", "name", true, "Four teams"]
note = "Game 2: four teams on map 5, no power ups"

[[steps]]
bot = "c"
send = "INITIATEJOINGAME"
args = [2, 0]
note = "c leaves game 1 for game 2, team 0"

[[steps]]
bot = "a"
send = "INITIATEJOINGAME"
args = [2, 0]
note = "Two per team with four teams: TEAMS_FULL"

[[steps]]
bot = "a"
send = "INITIATEJOINGAME"
args = [2, 3]
note = "a, the creator of the waiting game 1, leaves it: game 1 is deleted"

[[steps]]
bot = "a"
send = 159

[[steps]]
bot = "b"
send = "UNOBSERVEINSTANCE"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "s"
send = "ROOM_DIRECTORY"
args = [true, 66]
settle_ms = 600

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig battleball.ticket.charge 20"]
settle_ms = 600

[[steps]]
bot = "a"
send = "INITIATECREATEGAME"
note = "10 tickets, 20 needed: CREATEFAILED 2"

[[steps]]
bot = "a"
send = "GAMEPARAMETERVALUES"
args = [4, "fieldType", false, 2, "numTeams", false, 2, "allowedPowerups", true, "1", "name", true, "No tickets"]
note = "a leaves game 2 first, then has too few tickets: no game, no INSTANCELIST"

[[steps]]
bot = "a"
send = "INITIATEJOINGAME"
args = [2, 1]
note = "JOINFAILED 2"

[[steps]]
bot = "s"
send = "CHAT"
args = [":setconfig battleball.ticket.charge 2"]
settle_ms = 600

[[steps]]
bot = "b"
send = "KICKPLAYER"
args = [2]

[[steps]]
bot = "b"
send = "LEAVEGAME"
note = "The creator leaves game 2: deleted"

[[steps]]
bot = "c"
send = "REQUEST_GAME_LOBBY"
header_only = ["ROOMFORWARD"]
note = "A random lobby the first time"

[[steps]]
bot = "c"
send = "REQUEST_GAME_LOBBY"
header_only = ["ROOMFORWARD"]
note = "Then the other one"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 600
note = "LOUNGEINFO, GAMEPLAYERINFO of everyone in the lobby, then of a to the room (the lobby's NPC, Xenia, joins now)"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 600

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 600

[[steps]]
bot = "b"
send = "QUIT"
settle_ms = 600

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true

[[steps]]
bot = "c"
disconnect = true

[[steps]]
bot = "s"
disconnect = true
