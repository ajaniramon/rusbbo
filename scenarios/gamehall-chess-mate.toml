name = "gamehall-chess-mate"
description = "Chess moves in the Chess hall (room 64), with chesslib: a move before the sides are chosen, CHOOSETYPE (no such side, white and black for both, taken), moves out of turn, an illegal move, a move to the same square, a bad square, the scholar's mate (the winner's line, PIECEDATA), moves and CHOOSETYPE after the end, RESTART, a check and a move that ignores it, a promotion-rank move that is not legal"

# hallC: door 0,0; the chairs 2,7 + 2,9 are a table (ChessTrigger). No NPCs. IIM bodies are
# "<game id> <command> <args>"; `$gameid` is the id of the bot's last OPENGAMEBOARD. Every
# command answers PIECEDATA to both players: whose turn it is and every piece.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 64]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 64]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "a"
send = "WALK"
args = [2, 7]
settle_ms = 3500

[[steps]]
bot = "b"
send = "WALK"
args = [2, 9]
wait_for = ["OPENGAMEBOARD"]
settle_ms = 1500
note = "The game starts for both"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e2 e4" }]
note = "No sides yet, nobody's turn: TYPERESERVED and the board"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid CHOOSETYPE x" }]
note = "No such side: nothing"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid CHOOSETYPE w" }]
note = "a is white, b black (SELECTTYPE to each), the board with white to move"

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid CHOOSETYPE b" }]
note = "Taken: TYPERESERVED"

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e7 e5" }]
note = "Not b's turn: TYPERESERVED and the board"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e2 e5" }]
note = "Illegal: the board, still white's turn"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e2 e2" }]
note = "The same square: nothing"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE z9 e4" }]
note = "Not a square: Square.valueOf throws, nothing"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e2 e4" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e7 e5" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f1 c4" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE b8 c6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE d1 h5" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g8 f6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE h5 f7" }]
note = "Scholar's mate: the winner's line to both, the board"

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a7 a6" }]
note = "Not b's turn (the winner keeps it)"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a2 a3" }]
note = "The game is over: TYPERESERVED"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid CHOOSETYPE b" }]
note = "Taken"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid RESTART" }]
note = "A new board, white (a) to move"

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE e2 e4" }]

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE f7 f6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE d1 h5" }]
note = "Check"

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a7 a6" }]
note = "Ignores the check: illegal"

[[steps]]
bot = "b"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE g7 g6" }]

[[steps]]
bot = "a"
send = "IIM"
args = [{ raw = "$gameid MOVEPIECE a2 a8" }]
note = "To the promotion rank, not legal even as a queen"

[[steps]]
bot = "b"
send = "QUIT"
settle_ms = 800

[[steps]]
bot = "a"
send = "QUIT"

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true
