name = "rcon-users"
description = "The website's RCON messages about users and the hotel: hotel_alert (with and without its values, the header in capitals), user_alert, room_alert, refresh_credits, refresh_looks (USER_OBJECT, FIGURE_CHANGE to the room), refresh_club, refresh_hand, friendrequest (stored and sent once), refreshmessengercategories, refreshgroupperms (GROUP_MEMBERSHIP_UPDATE without a group), refreshcatalogue and refreshcataloguefrontpage (the catalogue index to everyone), the messages that only reload a manager, a user who is offline, an unknown header, and disconnect"

# Room 7 (ballroom, no NPCs). a = tracebot1 (id 1, instance 0), b = tracebot2 (id 2, instance 1).
# The website's housekeeping sends these after it changed the database; nothing changed here, so
# the refreshes read back what the players already have. Java's RconConnectionHandler (port 12309)
# answers nothing; what it sends goes to the players.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "b"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "b"
send = "G_HMAP"

[[steps]]
bot = "b"
send = "G_USRS"

[[steps]]
bot = "b"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "a"
rcon = "hotel_alert"
rcon_values = { sender = "Staff", message = "The hotel closes at ten" }
note = "ALERT to everyone online"

[[steps]]
bot = "a"
rcon = "hotel_alert"
note = "Without values: Java writes \"null\""

[[steps]]
bot = "a"
rcon = "HOTEL_ALERT"
rcon_values = { sender = "Staff", message = "Again" }
note = "Headers ignore case"

[[steps]]
bot = "a"
rcon = "user_alert"
rcon_values = { userId = "2", message = "Only for you" }
note = "ALERT to b"

[[steps]]
bot = "a"
rcon = "user_alert"
rcon_values = { userId = "99", message = "Nobody" }
note = "Not online: nothing"

[[steps]]
bot = "a"
rcon = "room_alert"
rcon_values = { roomId = "7", message = "Ballroom notice" }
note = "ALERT to the room"

[[steps]]
bot = "a"
rcon = "room_alert"
rcon_values = { roomId = "8", message = "Empty room" }
note = "A room nobody is in: nothing"

[[steps]]
bot = "a"
rcon = "refresh_credits"
rcon_values = { userId = "1" }
note = "CREDIT_BALANCE"

[[steps]]
bot = "a"
rcon = "refresh_looks"
rcon_values = { userId = "1" }
note = "USER_OBJECT to a, FIGURE_CHANGE to the room"

[[steps]]
bot = "a"
rcon = "refresh_club"
rcon_values = { userId = "2" }
note = "CREDIT_BALANCE, RIGHTS and the club's days"

[[steps]]
bot = "a"
rcon = "refresh_hand"
rcon_values = { userId = "1" }
note = "The hand again (in a room)"

[[steps]]
bot = "a"
rcon = "friendrequest"
rcon_values = { userId = "2", friendId = "1" }
note = "FRIEND_REQUEST from b to a"

[[steps]]
bot = "a"
rcon = "friendrequest"
rcon_values = { userId = "2", friendId = "1" }
note = "a has that request already: nothing"

[[steps]]
bot = "a"
rcon = "friendrequest"
rcon_values = { userId = "77", friendId = "1" }
note = "No such user: Java throws, nothing"

[[steps]]
bot = "a"
send = "MESSENGERINIT"
note = "The request is stored"

[[steps]]
bot = "a"
rcon = "refreshmessengercategories"
rcon_values = { userId = "1" }
note = "Nothing changed: nothing"

[[steps]]
bot = "a"
rcon = "refreshgroupperms"
rcon_values = { userId = "1" }
note = "GROUP_MEMBERSHIP_UPDATE -1 -1 to the room"

[[steps]]
bot = "a"
rcon = "refreshcatalogue"
note = "The catalogue index to everyone"

[[steps]]
bot = "a"
rcon = "refreshcataloguefrontpage"
note = "The settings again, and the index to everyone"

[[steps]]
bot = "a"
rcon = "refreshads"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshitemdefinitions"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshnavigator"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshroommodels"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshwordfilter"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshecotron"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshroombadges"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshstats"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refresh_tags"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "groupdeleted"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refreshgroup"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "clearphoto"
rcon_values = { userId = "1", itemId = "5" }

[[steps]]
bot = "a"
rcon = "nosuchheader"
rcon_values = { userId = "1", groupId = "1" }

[[steps]]
bot = "a"
rcon = "refresh_credits"
rcon_values = { userId = "x" }
note = "Not a number: nothing"

[[steps]]
bot = "a"
rcon = "disconnect"
rcon_values = { userId = "2" }
note = "b's connection is closed; a sees b leave"
settle_ms = 800

[[steps]]
bot = "a"
disconnect = true
