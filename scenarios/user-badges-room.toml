name = "user-badges-room"
description = "Badges inside a room: SETBADGE is broadcast as USERBADGE to everyone present, GETSELECTEDBADGES answers for any user id"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_USRS"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 800

[[steps]]
bot = "c"
send = "SETBADGE"
args = [1, "TB1", 4, "TB4"]
note = "broadcast to the room"

[[steps]]
bot = "a"
send = "GETSELECTEDBADGES"
args = [3]
note = "another user in the room"

[[steps]]
bot = "c"
send = "GETSELECTEDBADGES"
args = [3]
note = "oneself"

[[steps]]
bot = "a"
send = "GETSELECTEDBADGES"
args = [999]
note = "unknown user: no answer"

[[steps]]
bot = "c"
send = "SETBADGE"
args = []
note = "take off, broadcast of an empty list"

[[steps]]
bot = "a"
send = "QUIT"

[[steps]]
bot = "c"
send = "QUIT"

