name = "rcon-trade"
description = "RCON's refreshtrade in a Trade floor flat: switched on, the player gets ACH_TraderPass and enters the room again where they stand, and the trade sees the new setting; switched off, it changes in the room without a new entry; without its value or for a user who is offline nothing happens"

# Flat 1000 belongs to e (tracebot5, trading enabled) and is moved to category 113 'Trade floor'.
# a = tracebot1 (id 1) has trading off. Instance ids: e 0, a 1 (2 after the new entry).
# TRADEOPEN carries both users' trade setting.

[[bots]]
name = "e"
ticket = "trace-sso-5"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "e"
macro = "login"

[[steps]]
bot = "e"
send = "CREATEFLAT"
args = ["Trade Flat", "model_a", "open", true]

[[steps]]
bot = "e"
send = "SETFLATCAT"
args = [1000, 113]

[[steps]]
bot = "e"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "e"
send = "GOTOFLAT"
args = [1000]
ignore_status = ["flatctrl"]
settle_ms = 600

[[steps]]
bot = "e"
send = "G_HMAP"

[[steps]]
bot = "e"
send = "G_USRS"

[[steps]]
bot = "e"
send = "G_OBJS"

[[steps]]
bot = "e"
send = "G_ITEMS"

[[steps]]
bot = "e"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "TRYFLAT"
args = [1000, ""]

[[steps]]
bot = "a"
send = "GOTOFLAT"
args = [1000]
ignore_status = ["flatctrl"]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "TRADE_OPEN"
args = [0]
settle_ms = 800
note = "TRADEOPEN: a's trading is off"

[[steps]]
bot = "a"
send = "TRADE_CLOSE"
settle_ms = 600

[[steps]]
bot = "e"
rcon = "refreshtrade"
rcon_values = { userId = "1", tradeEnabled = "1" }
settle_ms = 1200
note = "On: ACH_TraderPass, and a enters the room again where they stand"

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_ITEMS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "TRADE_OPEN"
args = [0]
settle_ms = 800
note = "TRADEOPEN: a's trading is on"

[[steps]]
bot = "a"
send = "TRADE_CLOSE"
settle_ms = 600

[[steps]]
bot = "e"
rcon = "refreshtrade"
rcon_values = { userId = "1", tradeEnabled = "0" }
note = "Off: nothing is sent"

[[steps]]
bot = "a"
send = "TRADE_OPEN"
args = [0]
settle_ms = 800
note = "TRADEOPEN: off again, in the room too"

[[steps]]
bot = "a"
send = "TRADE_CLOSE"
settle_ms = 600

[[steps]]
bot = "e"
rcon = "refreshtrade"
rcon_values = { userId = "1" }
note = "Without tradeEnabled: Java throws, nothing"

[[steps]]
bot = "e"
rcon = "refreshtrade"
rcon_values = { userId = "3", tradeEnabled = "1" }
note = "Offline: nothing"

[[steps]]
bot = "e"
rcon = "refreshtrade"
rcon_values = { userId = "5", tradeEnabled = "1" }
note = "Already on: nothing"

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "e"
disconnect = true
