name = "messenger-search"
description = "Console user search (FINDUSER) with SQL wildcards: MariaDB's LIKE decides, including a pattern with many % that must not stall the server"

# Java: MessengerDao.search, `username LIKE ?` with `query%`; % and _ in the query are wildcards.
# The usernames are tracebot1-tracebot6.

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "MESSENGERINIT"

[[steps]]
bot = "a"
send = "FINDUSER"
args = ["tracebot2"]

[[steps]]
bot = "a"
send = "FINDUSER"
args = ["%bot3"]

[[steps]]
bot = "a"
send = "FINDUSER"
args = ["TRACE_OT4"]

[[steps]]
bot = "a"
send = "FINDUSER"
args = ["%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%Q"]
note = "No match; a naive matcher is exponential in the number of %"

[[steps]]
bot = "a"
send = "FINDUSER"
args = ["%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%5"]

[[steps]]
bot = "a"
send = "FINDUSER"
args = ["nobody"]
