name = "call-for-help"
description = "Calls for help (CRY): submitting one (once), asking for it, a moderator changing its category, picking it up, answering, the caller withdrawing a call, following one to its room, and users without the right"

# Room 7 (ballroom, no NPCs). a = tracebot1 calls, s = tracestaff and m = tracemod receive calls
# (fuse_receive_calls_for_help), b = tracebot2 has no right. Call ids start at 0 with every
# server start. CALL_FOR_HELP and a CFH_ACK with a call carry the request time as
# "HH:mm d/MM/YYYY", whose length changes with the date: those steps check them by header only
# (the bodies are checked by the unit tests of messages/outgoing/moderation.rs).
# Java purges closed calls every 60 s of uptime; the scenario ends well before that.

[[bots]]
name = "s"
ticket = "trace-sso-21"

[[bots]]
name = "m"
ticket = "trace-sso-22"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[bots]]
name = "b"
ticket = "trace-sso-2"

[[steps]]
bot = "s"
macro = "login"

[[steps]]
bot = "m"
macro = "login"

[[steps]]
bot = "b"
macro = "login"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "SUBMIT_CFH"
args = ["Not in a room"]
note = "Only from inside a room: nothing"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_USRS"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "REQUEST_CFH"
note = "No open call"

[[steps]]
bot = "a"
send = "SUBMIT_CFH"
args = ["Someone is being rude"]
header_only = ["CALL_FOR_HELP"]
note = "Call 0 to s and m; a gets CRY_RECEIVED"

[[steps]]
bot = "a"
send = "SUBMIT_CFH"
args = ["Hello?"]
note = "One open call per user: nothing"

[[steps]]
bot = "a"
send = "REQUEST_CFH"
header_only = ["CFH_ACK"]

[[steps]]
bot = "b"
send = "CHANGECALLCATEGORY"
args = ["0", 1]
note = "No right: nothing"

[[steps]]
bot = "s"
send = "CHANGECALLCATEGORY"
args = ["0", 3]
header_only = ["CALL_FOR_HELP"]

[[steps]]
bot = "s"
send = "CHANGECALLCATEGORY"
args = ["7", 3]
note = "No such call: nothing"

[[steps]]
bot = "s"
send = "PICK_CALLFORHELP"
args = ["0", false]
note = "PICKED_CRY to s and m"

[[steps]]
bot = "a"
send = "REQUEST_CFH"
note = "A picked call is not open any more"

[[steps]]
bot = "s"
send = "MESSAGETOCALLER"
args = ["0", "We are looking into it"]
note = "CRY_REPLY to a, DELETE_CRY to s and m"

[[steps]]
bot = "a"
send = "SUBMIT_CFH"
args = ["Second call"]
header_only = ["CALL_FOR_HELP"]

[[steps]]
bot = "a"
send = "DELETE_CRY"
note = "a withdraws call 1"

[[steps]]
bot = "a"
send = "DELETE_CRY"
note = "Nothing open: nothing"

[[steps]]
bot = "a"
send = "SUBMIT_CFH"
args = ["Third call"]
header_only = ["CALL_FOR_HELP"]

[[steps]]
bot = "m"
send = "PICK_CALLFORHELP"
args = ["2", true]
note = "Picked and closed at once"

[[steps]]
bot = "a"
send = "SUBMIT_CFH"
args = ["Fourth call"]
header_only = ["CALL_FOR_HELP"]

[[steps]]
bot = "b"
send = "FOLLOW_CRYFORHELP"
args = ["3"]
note = "No right: nothing"

[[steps]]
bot = "m"
send = "FOLLOW_CRYFORHELP"
args = ["3"]
note = "ROOMFORWARD to the public room, DELETE_CRY"

[[steps]]
bot = "s"
send = "MESSAGETOCALLER"
args = ["99", "Nobody"]

[[steps]]
bot = "a"
disconnect = true

[[steps]]
bot = "b"
disconnect = true

[[steps]]
bot = "m"
disconnect = true

[[steps]]
bot = "s"
disconnect = true
