name = "user-effects"
description = "Avatar effects: ACTIVATE_AVATAR_EFFECT (an effect not owned, one copy of an effect owned twice, AVATAR_EFFECTS with the time left), USE_AVATAR_EFFECT outside a room, in a room (USER_AVATAR_EFFECT), of an effect not activated, waving refused, a visitor's G_STAT, a drink stopping the effect, an effect stopping the drink, :sit re-sending it after the tick, switching it off, and the effect kept into the next room"

# Room 7 (ballroom, no NPCs). c = tracebot3, who owns effect 1 twice and effect 2 (none activated;
# effect 3 was used up and is gone at login); a = tracebot1 visits. settings_effects gives effects
# 1 and 2 an hour (3600 s).

[[bots]]
name = "c"
ticket = "trace-sso-3"

[[bots]]
name = "a"
ticket = "trace-sso-1"

[[steps]]
bot = "c"
macro = "login"

[[steps]]
bot = "c"
send = "USE_AVATAR_EFFECT"
args = [2]
note = "Not in a room: ignored"

[[steps]]
bot = "c"
send = "ACTIVATE_AVATAR_EFFECT"
args = [9]
note = "Not owned: ignored"

[[steps]]
bot = "c"
send = "ACTIVATE_AVATAR_EFFECT"
args = [1]
note = "The first copy of effect 1"

[[steps]]
bot = "c"
send = "ACTIVATE_AVATAR_EFFECT"
args = [1]
note = "The second copy"

[[steps]]
bot = "c"
send = "ACTIVATE_AVATAR_EFFECT"
args = [1]
note = "No copy left to activate: ignored"

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "c"
send = "USE_AVATAR_EFFECT"
args = [2]
note = "Owned but not activated: ignored"

[[steps]]
bot = "c"
send = "USE_AVATAR_EFFECT"
args = [1]
note = "USER_AVATAR_EFFECT to the room"

[[steps]]
bot = "c"
send = "WAVE"
note = "No waving with an effect"

[[steps]]
bot = "a"
macro = "login"

[[steps]]
bot = "a"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "a"
send = "G_HMAP"

[[steps]]
bot = "a"
send = "G_OBJS"

[[steps]]
bot = "a"
send = "G_STAT"
settle_ms = 1200
note = "a sees c's effect"

[[steps]]
bot = "c"
send = "CARRYDRINK"
args = [5]
settle_ms = 800
note = "The drink stops the effect"

[[steps]]
bot = "c"
send = "USE_AVATAR_EFFECT"
args = [1]
settle_ms = 800
note = "The effect stops the drink (refreshUser)"

[[steps]]
bot = "c"
send = "CHAT"
args = [":sit"]
settle_ms = 800
note = "Sitting: the effect again after the next tick"

[[steps]]
bot = "c"
send = "USE_AVATAR_EFFECT"
args = [0]
note = "Switched off"

[[steps]]
bot = "c"
send = "USE_AVATAR_EFFECT"
args = [1]

[[steps]]
bot = "c"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600
note = "Into the room again: the effect stays on"

[[steps]]
bot = "c"
send = "G_HMAP"

[[steps]]
bot = "c"
send = "G_OBJS"

[[steps]]
bot = "c"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "a"
send = "QUIT"

[[steps]]
bot = "c"
send = "QUIT"
