name = "catalogue-effects"
description = "Buying avatar effects (purchaseEffect): an effect as a gift (refused, nothing charged), an effect for pixels (AVATAR_EFFECT_ADDED, AVATAR_EFFECTS, the pixels), one too expensive (NO_CREDITS), then activating and wearing the bought effect in a room"

# e = tracebot5 (Habbo Club, 100 pixels). Catalogue items 729 (avatar_effect1, effect 1, 89
# pixels) and 730 (avatar_effect2, effect 2, 139 pixels) are on page 60 (Special Effects). Room 7
# (ballroom) has no NPCs.

[[bots]]
name = "e"
ticket = "trace-sso-5"

[[steps]]
bot = "e"
macro = "login"

[[steps]]
bot = "e"
send = "GRPC"
args = [0, 729, "", true, "tracebot5", "for me"]
note = "Effects cannot be gifts: nothing bought, nothing charged"

[[steps]]
bot = "e"
send = "GRPC"
args = [0, 729, "", false]
wait_for = ["ActivityPointNotification"]
note = "Effect 1 for 89 pixels"

[[steps]]
bot = "e"
send = "GRPC"
args = [0, 730, "", false]
note = "139 pixels: NO_CREDITS"

[[steps]]
bot = "e"
send = "ACTIVATE_AVATAR_EFFECT"
args = [1]

[[steps]]
bot = "e"
send = "ROOM_DIRECTORY"
args = [true, 7]
settle_ms = 600

[[steps]]
bot = "e"
send = "G_HMAP"

[[steps]]
bot = "e"
send = "G_OBJS"

[[steps]]
bot = "e"
send = "G_STAT"
settle_ms = 1200

[[steps]]
bot = "e"
send = "USE_AVATAR_EFFECT"
args = [1]

[[steps]]
bot = "e"
send = "QUIT"
