[package]
name = "rusbbo-import"
version = "0.1.0"
description = "Copies a Havana MariaDB database into a rusbbo database file"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusbbo-storage = { version = "0.1.0", path = "../storage" }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust"] }
serde_json = "1.0.154"
