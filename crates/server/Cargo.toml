[package]
name = "rusbbo-server"
version = "0.1.0"
description = "A Habbo Hotel v31 and r39 server with its website, a Rust rewrite of Havana"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
rusbbo-pebble = { version = "0.1.0", path = "../pebble" }
rusbbo-protocol = { version = "0.1.0", path = "../protocol" }
rusbbo-storage = { version = "0.1.0", path = "../storage" }
rusbbo-import = { version = "0.1.0", path = "../import", default-features = false }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
parking_lot = "0.12.5"
rand = "0.10.3"
regex = "1"
roxmltree = "0.20"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
unicode-normalization = "0.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }

[dev-dependencies]
rusbbo-storage = { version = "0.1.0", path = "../storage", features = ["test-faults"] }
tempfile = "3.27.0"
