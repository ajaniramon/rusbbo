[package]
name = "rusbbo-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
redb = "2.6.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[features]
# `Store::fail_next_commits`, for tests that prove a change is one transaction.
test-faults = []

[dev-dependencies]
tempfile = "3.27.0"
