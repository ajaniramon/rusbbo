name: Release

# Builds rusbbo-server and rusbbo-import for each platform. Pushing a tag `v*` publishes them
# as a GitHub release; running the workflow by hand only builds them (as artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, ext: tar.gz }
          - { name: linux-arm64, os: ubuntu-22.04-arm, ext: tar.gz }
          - { name: windows-x86_64, os: windows-latest, ext: zip }
          - { name: macos-arm64, os: macos-latest, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rusbbo-server -p rusbbo-import
      - name: Package
        shell: bash
        run: |
          dir="rusbbo-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$dir"
          exe=""; [[ "${{ runner.os }}" == "Windows" ]] && exe=".exe"
          cp "target/release/rusbbo-server$exe" "target/release/rusbbo-import$exe" README.md LICENSE "$dir/"
          if [[ "${{ matrix.ext }}" == "zip" ]]; then 7z a "$dir.zip" "$dir" > /dev/null; else tar -czf "$dir.tar.gz" "$dir"; fi
          echo "ASSET=$dir.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
